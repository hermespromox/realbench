<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>City</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #05070b;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  const canvas = document.getElementById("c");
  const ctx = canvas.getContext("2d");
  const W = window.innerWidth;
  const H = window.innerHeight;
  canvas.width = W;
  canvas.height = H;

  const PAD = Math.max(10, Math.min(28, W * 0.012));
  let COLS = 6;
  let ROWS = 4;
  if (W < 820) COLS = 4;
  else if (W < 1100) COLS = 5;
  else if (W > 1600) COLS = 7;
  if (H < 560) ROWS = 3;
  else if (H > 980) ROWS = 5;

  const usableW = W - PAD * 2;
  const usableH = H - PAD * 2;
  const STREET = Math.max(46, Math.min(62, Math.floor(Math.min(W, H) / 16)));
  const blockW = (usableW - (COLS + 1) * STREET) / COLS;
  const blockH = (usableH - (ROWS + 1) * STREET) / ROWS;
  const LANE = Math.max(8, STREET * 0.17);
  const CAR_W = Math.max(6.5, STREET * 0.13);
  const CAR_L = CAR_W * 2.05;

  function streetX(i) {
    return PAD + i * (blockW + STREET) + STREET / 2;
  }
  function streetY(j) {
    return PAD + j * (blockH + STREET) + STREET / 2;
  }
  function buildingRect(c, r) {
    return {
      x: PAD + STREET + c * (blockW + STREET),
      y: PAD + STREET + r * (blockH + STREET),
      w: blockW,
      h: blockH
    };
  }
  function laneOffset(dir) {
    if (dir === 0) return { x: 0, y: LANE };
    if (dir === 1) return { x: -LANE, y: 0 };
    if (dir === 2) return { x: 0, y: -LANE };
    return { x: LANE, y: 0 };
  }
  const DIRV = [
    { x: 1, y: 0 },
    { x: 0, y: 1 },
    { x: -1, y: 0 },
    { x: 0, y: -1 }
  ];

  function mulberry32(a) {
    return function () {
      let t = (a += 0x6d2b79f5);
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  const rng = mulberry32(0xc1a55e);
  const rand = (a, b) => a + rng() * (b - a);
  const irand = (a, b) => (a + Math.floor(rng() * (b - a + 1)));
  const pick = (arr) => arr[(rng() * arr.length) | 0];

  const PARK = { c: Math.min(1, COLS - 1), r: Math.min(ROWS - 1, Math.floor(ROWS / 2)) };
  const PLAZA = { c: Math.min(COLS - 1, Math.floor(COLS * 0.6)), r: 0 };
  const LANDMARK = { c: Math.min(COLS - 1, COLS - 2), r: Math.min(ROWS - 1, 1) };

  function isPark(c, r) {
    return c === PARK.c && r === PARK.r;
  }
  function isPlaza(c, r) {
    return c === PLAZA.c && r === PLAZA.r;
  }

  const WINDOW_PAL = [
    "#e6c86a",
    "#f0d78c",
    "#9ec4e8",
    "#7ec8d9",
    "#d9e6f2",
    "#f2b199",
    "#c9a6e8",
    "#8ee0c0"
  ];
  const BUILDING_COLS = [
    "#141821",
    "#191e2a",
    "#12161f",
    "#1c2230",
    "#10141c",
    "#222838",
    "#171c28",
    "#0e121a"
  ];
  const CAR_COLS = [
    "#c4453c",
    "#d4564a",
    "#3d6eb5",
    "#2f5a9e",
    "#e8e4de",
    "#cfc8bf",
    "#2b2d33",
    "#3a3e48",
    "#d4a017",
    "#e0b422",
    "#2f9e6a",
    "#3d7a9e",
    "#8b4d9e",
    "#b85c38",
    "#5a6a7a"
  ];

  const buildings = [];
  const trees = [];
  const lamps = [];
  const windows = [];

  for (let c = 0; c < COLS; c++) {
    for (let r = 0; r < ROWS; r++) {
      const b = buildingRect(c, r);
      const type = isPark(c, r) ? "park" : isPlaza(c, r) ? "plaza" : (c === LANDMARK.c && r === LANDMARK.r) ? "landmark" : pick(["office", "office", "res", "res", "mixed", "dark"]);
      const inset = 7;
      const bx = b.x + inset;
      const by = b.y + inset;
      const bw = b.w - inset * 2;
      const bh = b.h - inset * 2;
      const col = pick(BUILDING_COLS);
      const accent = pick(["#3a6ea5", "#a56b3a", "#3a8a7a", "#6a3a8a", "#8a4a4a", "#4a5a6a"]);
      buildings.push({ c, r, x: bx, y: by, w: bw, h: bh, type, col, accent, roofBits: [] });

      if (type === "park") {
        const n = 14 + irand(0, 10);
        for (let t = 0; t < n; t++) {
          trees.push({
            x: bx + rand(12, bw - 12),
            y: by + rand(12, bh - 12),
            s: rand(5, 10),
            g: rand(0.45, 0.75)
          });
        }
        continue;
      }
      if (type === "plaza") {
        for (let t = 0; t < 6; t++) {
          trees.push({
            x: bx + rand(10, bw - 10),
            y: by + rand(10, bh - 10),
            s: rand(4, 7),
            g: rand(0.4, 0.6)
          });
        }
      }

      const building = buildings[buildings.length - 1];
      const bits = 3 + irand(0, 4);
      for (let k = 0; k < bits; k++) {
        building.roofBits.push({
          x: rand(8, bw - 18),
          y: rand(8, bh - 18),
          w: rand(6, 16),
          h: rand(5, 12),
          kind: rng() < 0.3 ? "circle" : "rect"
        });
      }

      const padX = 6;
      const padY = 6;
      const cellW = type === "res" ? 7.5 : 6.4;
      const cellH = type === "res" ? 8.2 : 7.2;
      const colsW = Math.max(3, Math.floor((bw - padX * 2) / cellW));
      const rowsW = Math.max(3, Math.floor((bh - padY * 2) / cellH));
      const startX = bx + (bw - colsW * cellW) / 2;
      const startY = by + (bh - rowsW * cellH) / 2 + 2;
      const winW = type === "res" ? 3.2 : 2.7;
      const winH = type === "res" ? 4.2 : 3.6;
      const baseOn = type === "dark" ? 0.12 : type === "office" ? 0.62 : type === "landmark" ? 0.78 : 0.45;
      for (let wy = 0; wy < rowsW; wy++) {
        for (let wx = 0; wx < colsW; wx++) {
          if (type === "res" && rng() < 0.18) continue;
          if (rng() < 0.08) continue;
          const on = rng() < baseOn;
          windows.push({
            x: startX + wx * cellW + (cellW - winW) / 2,
            y: startY + wy * cellH + (cellH - winH) / 2,
            w: winW,
            h: winH,
            on,
            col: pick(WINDOW_PAL),
            baseOn,
            flicker: rng() < 0.04,
            phase: rand(0, Math.PI * 2),
            next: rand(0.4, 4.5)
          });
        }
      }
    }
  }

  for (let i = 0; i <= COLS; i++) {
    for (let j = 0; j <= ROWS; j++) {
      const ix = streetX(i);
      const iy = streetY(j);
      const alongV = j < ROWS;
      const alongH = i < COLS;
      if (alongV) {
        const y1 = streetY(j);
        const y2 = streetY(j + 1);
        const mid = (y1 + y2) / 2;
        lamps.push({ x: ix - STREET * 0.42, y: mid, on: rng() > 0.08 });
        lamps.push({ x: ix + STREET * 0.42, y: mid, on: rng() > 0.08 });
      }
      if (alongH) {
        const x1 = streetX(i);
        const x2 = streetX(i + 1);
        const mid = (x1 + x2) / 2;
        lamps.push({ x: mid, y: iy - STREET * 0.42, on: rng() > 0.08 });
        lamps.push({ x: mid, y: iy + STREET * 0.42, on: rng() > 0.08 });
      }
    }
  }

  const asphalt = document.createElement("canvas");
  asphalt.width = 128;
  asphalt.height = 128;
  const actx = asphalt.getContext("2d");
  actx.fillStyle = "#1a1c24";
  actx.fillRect(0, 0, 128, 128);
  for (let i = 0; i < 900; i++) {
    const n = rng();
    actx.fillStyle = n > 0.5 ? "rgba(255,255,255,0.03)" : "rgba(0,0,0,0.08)";
    actx.fillRect((rng() * 128) | 0, (rng() * 128) | 0, 1 + (rng() * 2) | 0, 1);
  }
  const asphaltPat = ctx.createPattern(asphalt, "repeat");

  const GREEN = 3.6;
  const YELLOW = 0.55;
  const CYCLE = (GREEN + YELLOW) * 2;

  function lightPhase(i, j, time) {
    const offset = (i * 1.15 + j * 0.85) % CYCLE;
    const t = (time + offset) % CYCLE;
    if (t < GREEN) return { ns: "green", ew: "red" };
    if (t < GREEN + YELLOW) return { ns: "yellow", ew: "red" };
    if (t < GREEN + YELLOW + GREEN) return { ns: "red", ew: "green" };
    return { ns: "red", ew: "yellow" };
  }
  function lightForDir(i, j, dir, time) {
    const p = lightPhase(i, j, time);
    return dir === 0 || dir === 2 ? p.ew : p.ns;
  }

  const cars = [];
  const peds = [];
  const walkers = [];
  let time = 0;

  function snapLane(car) {
    if (car.dir === 0 || car.dir === 2) {
      let best = car.y;
      let bestD = 1e9;
      for (let j = 0; j <= ROWS; j++) {
        const ly = streetY(j) + (car.dir === 0 ? LANE : -LANE);
        const d = Math.abs(ly - car.y);
        if (d < bestD) {
          bestD = d;
          best = ly;
        }
      }
      if (bestD < STREET) car.y = best;
    } else {
      let best = car.x;
      let bestD = 1e9;
      for (let i = 0; i <= COLS; i++) {
        const lx = streetX(i) + (car.dir === 3 ? LANE : -LANE);
        const d = Math.abs(lx - car.x);
        if (d < bestD) {
          bestD = d;
          best = lx;
        }
      }
      if (bestD < STREET) car.x = best;
    }
  }

  function nextIntersection(car) {
    let best = null;
    let bestD = 1e9;
    const tol = LANE + 7;
    for (let i = 0; i <= COLS; i++) {
      for (let j = 0; j <= ROWS; j++) {
        const ix = streetX(i);
        const iy = streetY(j);
        if (car.dir === 0) {
          if (Math.abs(car.y - (iy + LANE)) < tol && ix - car.x > 4) {
            const d = ix - car.x;
            if (d < bestD) {
              bestD = d;
              best = { i, j, ix, iy, d };
            }
          }
        } else if (car.dir === 2) {
          if (Math.abs(car.y - (iy - LANE)) < tol && car.x - ix > 4) {
            const d = car.x - ix;
            if (d < bestD) {
              bestD = d;
              best = { i, j, ix, iy, d };
            }
          }
        } else if (car.dir === 1) {
          if (Math.abs(car.x - (ix - LANE)) < tol && iy - car.y > 4) {
            const d = iy - car.y;
            if (d < bestD) {
              bestD = d;
              best = { i, j, ix, iy, d };
            }
          }
        } else {
          if (Math.abs(car.x - (ix + LANE)) < tol && car.y - iy > 4) {
            const d = car.y - iy;
            if (d < bestD) {
              bestD = d;
              best = { i, j, ix, iy, d };
            }
          }
        }
      }
    }
    return best;
  }

  function gapAhead(car) {
    let min = 1e9;
    const look = 90;
    for (let k = 0; k < cars.length; k++) {
      const o = cars[k];
      if (o === car || o.dead) continue;
      if (o.turning) {
        const dx = o.x - car.x;
        const dy = o.y - car.y;
        const along = dx * DIRV[car.dir].x + dy * DIRV[car.dir].y;
        const side = Math.abs(dx * DIRV[car.dir].y - dy * DIRV[car.dir].x);
        if (along > 4 && along < look && side < 16) min = Math.min(min, along);
        continue;
      }
      if (o.dir !== car.dir) continue;
      if (car.dir === 0 || car.dir === 2) {
        if (Math.abs(o.y - car.y) > 8) continue;
        const ahead = car.dir === 0 ? o.x - car.x : car.x - o.x;
        if (ahead > 2 && ahead < look) min = Math.min(min, ahead);
      } else {
        if (Math.abs(o.x - car.x) > 8) continue;
        const ahead = car.dir === 1 ? o.y - car.y : car.y - o.y;
        if (ahead > 2 && ahead < look) min = Math.min(min, ahead);
      }
    }
    return min;
  }

  function spawnPointClear(x, y, dir) {
    for (let k = 0; k < cars.length; k++) {
      const o = cars[k];
      if (Math.abs(o.x - x) < 28 && Math.abs(o.y - y) < 16) return false;
    }
    return true;
  }

  function makeCar(forced) {
    const kind = rng() < 0.08 ? "bus" : rng() < 0.12 ? "taxi" : "car";
    const edge = irand(0, 3);
    let dir, x, y, i, j;
    if (edge === 0) {
      dir = 0;
      j = irand(0, ROWS);
      x = streetX(0) - STREET * 0.45;
      y = streetY(j) + LANE;
    } else if (edge === 1) {
      dir = 2;
      j = irand(0, ROWS);
      x = streetX(COLS) + STREET * 0.45;
      y = streetY(j) - LANE;
    } else if (edge === 2) {
      dir = 1;
      i = irand(0, COLS);
      x = streetX(i) - LANE;
      y = streetY(0) - STREET * 0.45;
    } else {
      dir = 3;
      i = irand(0, COLS);
      x = streetX(i) + LANE;
      y = streetY(ROWS) + STREET * 0.45;
    }
    if (!forced && !spawnPointClear(x, y, dir)) return null;
    const col = kind === "taxi" ? "#d4a017" : kind === "bus" ? pick(["#c9c43a", "#3a6e9e", "#8a3a3a"]) : pick(CAR_COLS);
    const len = kind === "bus" ? CAR_L * 1.85 : CAR_L * rand(0.92, 1.12);
    const wid = kind === "bus" ? CAR_W * 1.12 : CAR_W * rand(0.9, 1.08);
    return {
      x, y, dir,
      angle: dir * Math.PI / 2,
      speed: 0,
      maxSpeed: kind === "bus" ? rand(38, 52) : rand(52, 78),
      col,
      l: len,
      w: wid,
      kind,
      turning: false,
      turnT: 0,
      signal: 0,
      dead: false,
      wait: 0
    };
  }

  function startTurn(car, n, toDir) {
    const from = car.dir;
    const turn = (toDir - from + 4) % 4;
    if (turn === 0) return;
    const L = LANE;
    const ix = n.ix;
    const iy = n.iy;
    const p0 = { x: car.x, y: car.y };
    let p1, p2;
    const exitDist = STREET * 0.42;
    const off = laneOffset(toDir);
    p2 = {
      x: ix + DIRV[toDir].x * exitDist + off.x,
      y: iy + DIRV[toDir].y * exitDist + off.y
    };
    if (turn === 1) {
      p1 = {
        x: ix + off.x * 0.2 + laneOffset(from).x * 0.85,
        y: iy + off.y * 0.2 + laneOffset(from).y * 0.85
      };
    } else if (turn === 3) {
      p1 = {
        x: ix + DIRV[toDir].x * L * 1.4 + DIRV[from].x * L * 1.4,
        y: iy + DIRV[toDir].y * L * 1.4 + DIRV[from].y * L * 1.4
      };
    } else {
      p1 = { x: ix, y: iy };
    }
    const dx = p2.x - p0.x;
    const dy = p2.y - p0.y;
    const len = Math.max(18, Math.hypot(dx, dy) * 1.15);
    car.turning = true;
    car.turnT = 0;
    car.p0 = p0;
    car.p1 = p1;
    car.p2 = p2;
    car.toDir = toDir;
    car.turnLen = len;
    car.signal = turn === 1 ? 1 : turn === 3 ? -1 : 0;
  }

  function quad(a, b, c, t) {
    const u = 1 - t;
    return u * u * a + 2 * u * t * b + t * t * c;
  }
  function quadD(a, b, c, t) {
    return 2 * (1 - t) * (b - a) + 2 * t * (c - b);
  }

  function chooseDir(car, n) {
    const from = car.dir;
    const opts = [];
    for (let k = 0; k < 3; k++) opts.push(from);
    const right = (from + 1) % 4;
    const left = (from + 3) % 4;
    opts.push(right, right, left);
    if (n.i === 0 && from === 2) return from;
    if (n.i === COLS && from === 0) return from;
    if (n.j === 0 && from === 3) return from;
    if (n.j === ROWS && from === 1) return from;
    return opts[(Math.random() * opts.length) | 0];
  }

  function updateCars(dt) {
    const stopLine = STREET * 0.5 + 10;
    const enter = STREET * 0.28;
    for (let k = 0; k < cars.length; k++) {
      const car = cars[k];
      if (car.dead) continue;
      if (car.turning) {
        car.turnT += (car.speed * dt) / car.turnLen;
        const t = Math.min(1, car.turnT);
        car.x = quad(car.p0.x, car.p1.x, car.p2.x, t);
        car.y = quad(car.p0.y, car.p1.y, car.p2.y, t);
        const dx = quadD(car.p0.x, car.p1.x, car.p2.x, t);
        const dy = quadD(car.p0.y, car.p1.y, car.p2.y, t);
        if (Math.abs(dx) + Math.abs(dy) > 0.01) car.angle = Math.atan2(dy, dx);
        car.speed = Math.min(car.maxSpeed * 0.85, car.speed + 25 * dt);
        if (t >= 1) {
          car.turning = false;
          car.dir = car.toDir;
          car.x = car.p2.x;
          car.y = car.p2.y;
          car.angle = car.dir * Math.PI / 2;
          car.signal = 0;
          snapLane(car);
        }
        continue;
      }

      const n = nextIntersection(car);
      let desire = car.maxSpeed;
      const gap = gapAhead(car);
      const follow = car.kind === "bus" ? 26 : 20;
      if (gap < follow + 40) {
        const g = Math.max(0, gap - (car.l * 0.55 + 8));
        desire = Math.min(desire, (g / 28) * car.maxSpeed);
      }
      if (n) {
        const light = lightForDir(n.i, n.j, car.dir, time);
        const d = n.d;
        if (light === "red" || (light === "yellow" && d > 26)) {
          if (d < stopLine + 50) {
            const sd = d - stopLine;
            if (sd < 3) {
              desire = 0;
              car.wait += dt;
            } else if (sd < 55) {
              desire = Math.min(desire, Math.max(0, sd) * 1.1);
            }
          }
        } else {
          car.wait = 0;
          if (d < enter && d > 4) {
            const to = chooseDir(car, n);
            if (to !== car.dir) startTurn(car, n, to);
          }
        }
        if (car.wait > 8 && d < stopLine + 8) {
          car.wait = 0;
          const to = chooseDir(car, n);
          if (to !== car.dir) startTurn(car, n, to);
          else desire = car.maxSpeed * 0.5;
        }
      }

      const acc = desire > car.speed ? 55 : 80;
      if (desire > car.speed) car.speed = Math.min(desire, car.speed + acc * dt);
      else car.speed = Math.max(desire, car.speed - acc * dt);
      if (car.speed < 1.2 && desire < 1) car.speed = 0;
      car.x += DIRV[car.dir].x * car.speed * dt;
      car.y += DIRV[car.dir].y * car.speed * dt;
      car.angle = car.dir * Math.PI / 2;

      if (car.x < -40 || car.x > W + 40 || car.y < -40 || car.y > H + 40) car.dead = true;
    }
    for (let k = cars.length - 1; k >= 0; k--) if (cars[k].dead) cars.splice(k, 1);
  }

  const CROSS = [];
  (function pickCross() {
    const cand = [];
    for (let i = 1; i < COLS; i++) for (let j = 1; j < ROWS; j++) cand.push({ i, j });
    for (let n = 0; n < Math.min(4, cand.length); n++) {
      const idx = (rng() * cand.length) | 0;
      CROSS.push(cand.splice(idx, 1)[0]);
    }
  })();

  function spawnPedGroup(cr, walkingNS) {
    const ix = streetX(cr.i);
    const iy = streetY(cr.j);
    const side = rng() < 0.5 ? -1 : 1;
    const count = 2 + irand(0, 3);
    for (let p = 0; p < count; p++) {
      const delay = p * rand(0.12, 0.35);
      let x, y, tx, ty;
      const spread = (p - (count - 1) / 2) * 5;
      if (walkingNS) {
        const sx = ix + side * (STREET * 0.38) + spread * 0.3;
        const fromTop = rng() < 0.5;
        y = fromTop ? iy - STREET * 0.55 - 6 : iy + STREET * 0.55 + 6;
        x = sx;
        ty = fromTop ? iy + STREET * 0.55 + 6 : iy - STREET * 0.55 - 6;
        tx = sx + rand(-2, 2);
      } else {
        const sy = iy + side * (STREET * 0.38) + spread * 0.3;
        const fromLeft = rng() < 0.5;
        x = fromLeft ? ix - STREET * 0.55 - 6 : ix + STREET * 0.55 + 6;
        y = sy;
        tx = fromLeft ? ix + STREET * 0.55 + 6 : ix - STREET * 0.55 - 6;
        ty = sy + rand(-2, 2);
      }
      peds.push({
        x, y, tx, ty,
        ox: x, oy: y,
        state: "wait",
        delay,
        t: 0,
        cr,
        walkingNS,
        col: pick(["#d8d0c8", "#c4b8a8", "#3a3a44", "#6a4a3a", "#4a5a6a", "#8a3a3a", "#2a4a3a", "#e8e0d4"]),
        spd: rand(18, 28),
        r: rand(1.7, 2.4)
      });
    }
  }

  let pedTimer = 0.6;

  function updatePeds(dt) {
    pedTimer -= dt;
    if (pedTimer <= 0 && peds.length < 28) {
      const cr = CROSS[(Math.random() * CROSS.length) | 0];
      if (cr) {
        const ph = lightPhase(cr.i, cr.j, time);
        const nsWalk = ph.ns === "green" || ph.ns === "yellow";
        spawnPedGroup(cr, nsWalk);
      }
      pedTimer = rand(1.6, 3.4);
    }
    for (let i = peds.length - 1; i >= 0; i--) {
      const p = peds[i];
      const ph = lightPhase(p.cr.i, p.cr.j, time);
      const can = p.walkingNS ? ph.ns !== "red" : ph.ew !== "red";
      if (p.state === "wait") {
        p.delay -= dt;
        if (p.delay <= 0 && can) p.state = "walk";
        if (p.delay < -6) peds.splice(i, 1);
      } else {
        const dx = p.tx - p.x;
        const dy = p.ty - p.y;
        const d = Math.hypot(dx, dy);
        if (d < 1.5) {
          peds.splice(i, 1);
          continue;
        }
        p.x += (dx / d) * p.spd * dt;
        p.y += (dy / d) * p.spd * dt;
      }
    }
  }

  for (let c = 0; c < COLS; c++) {
    for (let r = 0; r < ROWS; r++) {
      const b = buildingRect(c, r);
      const inset = 3.5;
      const x = b.x + inset;
      const y = b.y + inset;
      const w = b.w - inset * 2;
      const h = b.h - inset * 2;
      const n = isPark(c, r) ? 5 : 2 + irand(0, 2);
      for (let k = 0; k < n; k++) {
        walkers.push({
          c, r, x, y, w, h,
          t: rng() * (2 * (w + h)),
          spd: rand(10, 18) * (rng() < 0.5 ? 1 : -1),
          col: pick(["#c8c0b4", "#4a4038", "#6a7380", "#8a5040", "#d0c8bc", "#2e323c", "#5a7060"]),
          r: rand(1.6, 2.3)
        });
      }
    }
  }

  function periPoint(x, y, w, h, t) {
    const p = 2 * (w + h);
    let s = ((t % p) + p) % p;
    if (s < w) return { x: x + s, y: y };
    s -= w;
    if (s < h) return { x: x + w, y: y + s };
    s -= h;
    if (s < w) return { x: x + w - s, y: y + h };
    s -= w;
    return { x: x, y: y + h - s };
  }

  function updateWalkers(dt) {
    for (let i = 0; i < walkers.length; i++) {
      const w = walkers[i];
      w.t += w.spd * dt;
      const p = periPoint(w.x, w.y, w.w, w.h, w.t);
      w.px = p.x;
      w.py = p.y;
    }
  }

  function updateWindows(dt) {
    const wave = 0.35 + 0.65 * (0.5 + 0.5 * Math.sin(time * 0.11));
    for (let i = 0; i < windows.length; i++) {
      const w = windows[i];
      w.next -= dt;
      if (w.flicker) w.phase += dt * 8;
      if (w.next <= 0) {
        const target = w.baseOn * (0.55 + 0.7 * wave);
        if (Math.random() < 0.55) w.on = Math.random() < target;
        else w.on = !w.on && Math.random() < target;
        w.next = rand(0.8, 6.5);
      }
    }
  }

  function densityTarget() {
    const t = time % 28;
    let d;
    if (t < 7) d = 0.28 + 0.72 * (t / 7);
    else if (t < 14) d = 1;
    else if (t < 21) d = 1 - 0.62 * ((t - 14) / 7);
    else d = 0.38 + 0.12 * Math.sin(t * 0.7);
    const cap = 18 + (COLS * ROWS) * 2.2;
    return Math.round(16 + (cap - 16) * d);
  }

  function manageTraffic() {
    const target = densityTarget();
    if (cars.length < target) {
      const n = Math.min(3, target - cars.length);
      for (let i = 0; i < n; i++) {
        const c = makeCar(false);
        if (c) cars.push(c);
      }
    } else if (cars.length > target + 6) {
      for (let i = 0; i < cars.length && cars.length > target + 2; i++) {
        const c = cars[i];
        if (c.x < 40 || c.x > W - 40 || c.y < 40 || c.y > H - 40) c.dead = true;
      }
    }
  }

  for (let i = 0; i < 26; i++) {
    const c = makeCar(true);
    if (!c) continue;
    const travel = rand(0.05, 0.9);
    if (c.dir === 0) c.x = PAD + travel * (W - PAD * 2);
    if (c.dir === 2) c.x = PAD + travel * (W - PAD * 2);
    if (c.dir === 1) c.y = PAD + travel * (H - PAD * 2);
    if (c.dir === 3) c.y = PAD + travel * (H - PAD * 2);
    snapLane(c);
    cars.push(c);
  }

  function roundRect(x, y, w, h, r) {
    const rr = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + rr, y);
    ctx.arcTo(x + w, y, x + w, y + h, rr);
    ctx.arcTo(x + w, y + h, x, y + h, rr);
    ctx.arcTo(x, y + h, x, y, rr);
    ctx.arcTo(x, y, x + w, y, rr);
    ctx.closePath();
  }

  function drawBackground() {
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, "#080b12");
    g.addColorStop(1, "#05070c");
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
  }

  function drawSidewalks() {
    ctx.fillStyle = "#2a2e38";
    ctx.fillRect(PAD, PAD, usableW, usableH);
    ctx.fillStyle = "#32363f";
    for (let c = 0; c < COLS; c++) {
      for (let r = 0; r < ROWS; r++) {
        const b = buildingRect(c, r);
        ctx.fillRect(b.x + 1, b.y + 1, b.w - 2, 1.2);
      }
    }
  }

  function drawStreets() {
    ctx.fillStyle = asphaltPat || "#1a1c24";
    for (let j = 0; j <= ROWS; j++) {
      const y = streetY(j) - STREET / 2;
      ctx.fillRect(PAD, y, usableW, STREET);
    }
    for (let i = 0; i <= COLS; i++) {
      const x = streetX(i) - STREET / 2;
      ctx.fillRect(x, PAD, STREET, usableH);
    }

    ctx.strokeStyle = "rgba(200, 180, 70, 0.35)";
    ctx.lineWidth = 1.2;
    ctx.setLineDash([]);
    for (let j = 0; j <= ROWS; j++) {
      const y = streetY(j);
      ctx.beginPath();
      ctx.moveTo(PAD, y);
      ctx.lineTo(PAD + usableW, y);
      ctx.stroke();
    }
    for (let i = 0; i <= COLS; i++) {
      const x = streetX(i);
      ctx.beginPath();
      ctx.moveTo(x, PAD);
      ctx.lineTo(x, PAD + usableH);
      ctx.stroke();
    }

    ctx.strokeStyle = "rgba(220, 225, 235, 0.22)";
    ctx.lineWidth = 1;
    ctx.setLineDash([7, 9]);
    for (let j = 0; j <= ROWS; j++) {
      const y1 = streetY(j) - LANE;
      const y2 = streetY(j) + LANE;
      for (let i = 0; i < COLS; i++) {
        const x1 = streetX(i) + STREET * 0.42;
        const x2 = streetX(i + 1) - STREET * 0.42;
        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y1);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(x1, y2);
        ctx.lineTo(x2, y2);
        ctx.stroke();
      }
    }
    for (let i = 0; i <= COLS; i++) {
      const x1 = streetX(i) - LANE;
      const x2 = streetX(i) + LANE;
      for (let j = 0; j < ROWS; j++) {
        const y1 = streetY(j) + STREET * 0.42;
        const y2 = streetY(j + 1) - STREET * 0.42;
        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(x1, y2);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(x2, y1);
        ctx.lineTo(x2, y2);
        ctx.stroke();
      }
    }
    ctx.setLineDash([]);

    ctx.strokeStyle = "rgba(230, 232, 240, 0.55)";
    ctx.lineWidth = 2;
    for (let k = 0; k < CROSS.length; k++) {
      const cr = CROSS[k];
      const ix = streetX(cr.i);
      const iy = streetY(cr.j);
      const hw = STREET * 0.36;
      const zw = 10;
      drawZebra(ix - hw, iy - STREET * 0.5 - 1, hw * 2, 8, true);
      drawZebra(ix - hw, iy + STREET * 0.5 - 7, hw * 2, 8, true);
      drawZebra(ix - STREET * 0.5 - 1, iy - hw, 8, hw * 2, false);
      drawZebra(ix + STREET * 0.5 - 7, iy - hw, 8, hw * 2, false);
    }
  }

  function drawZebra(x, y, w, h, horiz) {
    ctx.save();
    ctx.beginPath();
    ctx.rect(x, y, w, h);
    ctx.clip();
    ctx.fillStyle = "rgba(230,232,240,0.55)";
    if (horiz) {
      for (let i = 0; i < w; i += 5) ctx.fillRect(x + i, y, 3, h);
    } else {
      for (let i = 0; i < h; i += 5) ctx.fillRect(x, y + i, w, 3);
    }
    ctx.restore();
  }

  function drawParkAndPlaza() {
    for (let i = 0; i < buildings.length; i++) {
      const b = buildings[i];
      if (b.type === "park") {
        const g = ctx.createLinearGradient(b.x, b.y, b.x + b.w, b.y + b.h);
        g.addColorStop(0, "#163524");
        g.addColorStop(1, "#0f281c");
        ctx.fillStyle = g;
        roundRect(b.x, b.y, b.w, b.h, 8);
        ctx.fill();
        ctx.fillStyle = "#1c4a32";
        ctx.beginPath();
        ctx.ellipse(b.x + b.w * 0.55, b.y + b.h * 0.48, Math.min(22, b.w * 0.18), Math.min(16, b.h * 0.16), 0.3, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "#2a6a88";
        ctx.beginPath();
        ctx.ellipse(b.x + b.w * 0.55, b.y + b.h * 0.48, Math.min(16, b.w * 0.13), Math.min(11, b.h * 0.11), 0.3, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = "rgba(180, 200, 160, 0.18)";
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(b.x + 8, b.y + b.h * 0.5);
        ctx.quadraticCurveTo(b.x + b.w * 0.4, b.y + 10, b.x + b.w - 10, b.y + b.h * 0.35);
        ctx.stroke();
      } else if (b.type === "plaza") {
        ctx.fillStyle = "#2a2c34";
        roundRect(b.x, b.y, b.w, b.h, 6);
        ctx.fill();
        ctx.fillStyle = "#3a3230";
        ctx.fillRect(b.x + b.w * 0.2, b.y + b.h * 0.22, b.w * 0.6, b.h * 0.56);
        ctx.strokeStyle = "rgba(200, 170, 110, 0.25)";
        ctx.lineWidth = 2;
        ctx.strokeRect(b.x + b.w * 0.2, b.y + b.h * 0.22, b.w * 0.6, b.h * 0.56);
        ctx.fillStyle = "#4a80a8";
        ctx.beginPath();
        ctx.arc(b.x + b.w * 0.5, b.y + b.h * 0.5, Math.min(8, b.w * 0.08), 0, Math.PI * 2);
        ctx.fill();
      }
    }
    for (let i = 0; i < trees.length; i++) {
      const t = trees[i];
      ctx.fillStyle = "rgba(0,0,0,0.25)";
      ctx.beginPath();
      ctx.ellipse(t.x + 1.2, t.y + 1.5, t.s * 0.9, t.s * 0.55, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = `rgba(${20 + t.g * 40|0},${80 + t.g * 90|0},${40 + t.g * 30|0},1)`;
      ctx.beginPath();
      ctx.arc(t.x, t.y, t.s, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "rgba(160, 220, 140, 0.18)";
      ctx.beginPath();
      ctx.arc(t.x - t.s * 0.25, t.y - t.s * 0.25, t.s * 0.4, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function drawBuildings() {
    for (let i = 0; i < buildings.length; i++) {
      const b = buildings[i];
      if (b.type === "park" || b.type === "plaza") continue;
      ctx.fillStyle = "rgba(0,0,0,0.35)";
      roundRect(b.x + 3, b.y + 4, b.w, b.h, 4);
      ctx.fill();
      ctx.fillStyle = b.col;
      roundRect(b.x, b.y, b.w, b.h, 4);
      ctx.fill();
      ctx.fillStyle = "rgba(255,255,255,0.04)";
      ctx.fillRect(b.x + 2, b.y + 2, b.w - 4, 3);
      ctx.strokeStyle = "rgba(0,0,0,0.45)";
      ctx.lineWidth = 1.4;
      roundRect(b.x, b.y, b.w, b.h, 4);
      ctx.stroke();
      ctx.fillStyle = b.accent;
      ctx.globalAlpha = 0.35;
      ctx.fillRect(b.x, b.y, 3, b.h);
      ctx.globalAlpha = 1;
      if (b.type === "landmark") {
        ctx.fillStyle = "#1a2030";
        const hx = b.x + b.w * 0.5;
        const hy = b.y + b.h * 0.32;
        ctx.beginPath();
        ctx.arc(hx, hy, Math.min(16, b.w * 0.14), 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = "rgba(220,220,230,0.35)";
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.arc(hx, hy, Math.min(11, b.w * 0.1), 0, Math.PI * 2);
        ctx.stroke();
        ctx.fillStyle = "rgba(220,80,70,0.85)";
        ctx.beginPath();
        ctx.arc(hx, hy - Math.min(16, b.w * 0.14) - 4, 2.2, 0, Math.PI * 2);
        ctx.fill();
      }
      for (let k = 0; k < b.roofBits.length; k++) {
        const rb = b.roofBits[k];
        ctx.fillStyle = "rgba(0,0,0,0.25)";
        if (rb.kind === "circle") {
          ctx.beginPath();
          ctx.arc(b.x + rb.x, b.y + rb.y, rb.w * 0.35, 0, Math.PI * 2);
          ctx.fill();
        } else {
          ctx.fillRect(b.x + rb.x, b.y + rb.y, rb.w, rb.h);
        }
      }
    }
    for (let i = 0; i < windows.length; i++) {
      const w = windows[i];
      if (!w.on) {
        ctx.fillStyle = "rgba(8,10,16,0.7)";
        ctx.fillRect(w.x, w.y, w.w, w.h);
        continue;
      }
      let a = 1;
      if (w.flicker) a = 0.65 + 0.35 * Math.sin(w.phase);
      ctx.globalAlpha = a;
      ctx.fillStyle = w.col;
      ctx.fillRect(w.x, w.y, w.w, w.h);
      ctx.globalAlpha = 0.18 * a;
      ctx.fillStyle = w.col;
      ctx.fillRect(w.x - 1, w.y - 1, w.w + 2, w.h + 2);
      ctx.globalAlpha = 1;
    }
  }

  function drawLamps() {
    for (let i = 0; i < lamps.length; i++) {
      const L = lamps[i];
      if (L.on) {
        const grd = ctx.createRadialGradient(L.x, L.y, 0, L.x, L.y, 22);
        grd.addColorStop(0, "rgba(255, 220, 140, 0.16)");
        grd.addColorStop(1, "rgba(255, 220, 140, 0)");
        ctx.fillStyle = grd;
        ctx.beginPath();
        ctx.arc(L.x, L.y, 22, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.fillStyle = "#2a2e36";
      ctx.beginPath();
      ctx.arc(L.x, L.y, 2.1, 0, Math.PI * 2);
      ctx.fill();
      if (L.on) {
        ctx.fillStyle = "rgba(255, 230, 160, 0.9)";
        ctx.beginPath();
        ctx.arc(L.x, L.y, 1.3, 0, Math.PI * 2);
        ctx.fill();
      }
    }
  }

  function drawWalkers() {
    for (let i = 0; i < walkers.length; i++) {
      const w = walkers[i];
      if (w.px == null) continue;
      ctx.fillStyle = "rgba(0,0,0,0.3)";
      ctx.beginPath();
      ctx.ellipse(w.px + 0.6, w.py + 1.1, w.r * 0.9, w.r * 0.45, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = w.col;
      ctx.beginPath();
      ctx.arc(w.px, w.py, w.r, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "rgba(255,220,190,0.85)";
      ctx.beginPath();
      ctx.arc(w.px, w.py - w.r * 0.55, w.r * 0.42, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function drawPeds() {
    for (let i = 0; i < peds.length; i++) {
      const p = peds[i];
      const bob = p.state === "walk" ? Math.sin(time * 14 + i) * 0.4 : 0;
      ctx.fillStyle = "rgba(0,0,0,0.3)";
      ctx.beginPath();
      ctx.ellipse(p.x + 0.5, p.y + 1.2, p.r * 0.95, p.r * 0.45, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = p.col;
      ctx.beginPath();
      ctx.arc(p.x, p.y + bob, p.r, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "rgba(255,220,190,0.9)";
      ctx.beginPath();
      ctx.arc(p.x, p.y - p.r * 0.55 + bob, p.r * 0.45, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function drawCars() {
    for (let i = 0; i < cars.length; i++) {
      const car = cars[i];
      ctx.save();
      ctx.translate(car.x, car.y);
      ctx.rotate(car.angle);
      ctx.fillStyle = "rgba(0,0,0,0.35)";
      roundRect(-car.l / 2 + 1, -car.w / 2 + 1.5, car.l, car.w, 1.5);
      ctx.fill();

      if (car.speed > 8) {
        const hg = ctx.createLinearGradient(car.l / 2, 0, car.l / 2 + 18, 0);
        hg.addColorStop(0, "rgba(255,245,210,0.22)");
        hg.addColorStop(1, "rgba(255,245,210,0)");
        ctx.fillStyle = hg;
        ctx.beginPath();
        ctx.moveTo(car.l / 2 - 1, -car.w * 0.35);
        ctx.lineTo(car.l / 2 + 16, -car.w * 0.9);
        ctx.lineTo(car.l / 2 + 16, car.w * 0.9);
        ctx.lineTo(car.l / 2 - 1, car.w * 0.35);
        ctx.fill();
      }

      ctx.fillStyle = car.col;
      roundRect(-car.l / 2, -car.w / 2, car.l, car.w, 1.8);
      ctx.fill();
      ctx.fillStyle = "rgba(255,255,255,0.12)";
      ctx.fillRect(-car.l / 2 + 1, -car.w / 2, car.l - 2, car.w * 0.28);
      ctx.fillStyle = "rgba(40, 60, 80, 0.45)";
      roundRect(-car.l * 0.12, -car.w * 0.38, car.l * 0.34, car.w * 0.76, 1);
      ctx.fill();
      if (car.kind === "bus") {
        ctx.fillStyle = "rgba(40, 60, 80, 0.35)";
        roundRect(-car.l * 0.42, -car.w * 0.34, car.l * 0.22, car.w * 0.68, 1);
        ctx.fill();
      }
      ctx.fillStyle = "#f0e8c0";
      ctx.fillRect(car.l / 2 - 2.4, -car.w / 2 + 0.8, 2.2, car.w * 0.28);
      ctx.fillRect(car.l / 2 - 2.4, car.w / 2 - car.w * 0.28 - 0.8, 2.2, car.w * 0.28);
      ctx.fillStyle = "#c4453c";
      ctx.fillRect(-car.l / 2, -car.w / 2 + 0.8, 2, car.w * 0.28);
      ctx.fillRect(-car.l / 2, car.w / 2 - car.w * 0.28 - 0.8, 2, car.w * 0.28);
      if (car.signal && Math.sin(time * 14) > 0) {
        ctx.fillStyle = "#ff9a2a";
        if (car.signal === 1) {
          ctx.fillRect(car.l / 2 - 3, car.w / 2 - 2.4, 3, 2.2);
          ctx.fillRect(-car.l / 2, car.w / 2 - 2.4, 3, 2.2);
        } else {
          ctx.fillRect(car.l / 2 - 3, -car.w / 2, 3, 2.2);
          ctx.fillRect(-car.l / 2, -car.w / 2, 3, 2.2);
        }
      }
      ctx.restore();
    }
  }

  function drawLights() {
    for (let i = 0; i <= COLS; i++) {
      for (let j = 0; j <= ROWS; j++) {
        const ix = streetX(i);
        const iy = streetY(j);
        const ph = lightPhase(i, j, time);
        const positions = [
          { x: ix - STREET * 0.28, y: iy - STREET * 0.28, ns: true },
          { x: ix + STREET * 0.28, y: iy + STREET * 0.28, ns: true },
          { x: ix + STREET * 0.28, y: iy - STREET * 0.28, ns: false },
          { x: ix - STREET * 0.28, y: iy + STREET * 0.28, ns: false }
        ];
        for (let p = 0; p < 4; p++) {
          const pos = positions[p];
          const state = pos.ns ? ph.ns : ph.ew;
          ctx.fillStyle = "#1a1c22";
          roundRect(pos.x - 3.2, pos.y - 8.5, 6.4, 17, 1.5);
          ctx.fill();
          const lights = [
            { y: -5.2, col: "#ff3b3b", on: state === "red" },
            { y: 0, col: "#ffcc33", on: state === "yellow" },
            { y: 5.2, col: "#3dff7a", on: state === "green" }
          ];
          for (let s = 0; s < 3; s++) {
            const L = lights[s];
            if (L.on) {
              ctx.globalAlpha = 0.35;
              ctx.fillStyle = L.col;
              ctx.beginPath();
              ctx.arc(pos.x, pos.y + L.y, 4.5, 0, Math.PI * 2);
              ctx.fill();
              ctx.globalAlpha = 1;
            }
            ctx.fillStyle = L.on ? L.col : "rgba(40,42,50,0.9)";
            ctx.beginPath();
            ctx.arc(pos.x, pos.y + L.y, 1.85, 0, Math.PI * 2);
            ctx.fill();
          }
        }
      }
    }
  }

  function drawVignette() {
    const g = ctx.createRadialGradient(W * 0.5, H * 0.5, Math.min(W, H) * 0.25, W * 0.5, H * 0.5, Math.max(W, H) * 0.72);
    g.addColorStop(0, "rgba(0,0,0,0)");
    g.addColorStop(1, "rgba(0,0,0,0.48)");
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
  }

  function update(dt) {
    time += dt;
    manageTraffic();
    updateCars(dt);
    updatePeds(dt);
    updateWalkers(dt);
    updateWindows(dt);
  }

  function draw() {
    drawBackground();
    drawSidewalks();
    drawStreets();
    drawParkAndPlaza();
    drawLamps();
    drawBuildings();
    drawWalkers();
    drawPeds();
    drawCars();
    drawLights();
    drawVignette();
  }

  let last = performance.now();
  function loop(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    update(dt);
    draw();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
