<!DOCTYPE html>
<html>
<head>
<style>
body{margin:0;overflow:hidden;background:#0a0e14}
canvas{display:block}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
const W=canvas.width=window.innerWidth,H=canvas.height=window.innerHeight;
const UNIT=58,COS30=Math.cos(Math.PI/6),SIN30=0.5;
const cx=W/2-40,cy=H/2+20;
function w2s(x,y,z){return{x:cx+(x-y)*COS30*UNIT,y:cy+(x+y)*SIN30*UNIT-z*UNIT}}
function isoPoly(pts,color,stroke){
  let sp=pts.map(p=>w2s(p[0],p[1],p[2]));
  ctx.beginPath();ctx.moveTo(sp[0].x,sp[0].y);
  for(let i=1;i<sp.length;i++)ctx.lineTo(sp[i].x,sp[i].y);
  ctx.closePath();ctx.fillStyle=color;ctx.fill();
  if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=1;ctx.stroke()}
}
function isoBox(x,y,z,w,h,ht,top,left,right){
  isoPoly([[x,y,z+ht],[x+w,y,z+ht],[x+w,y+h,z+ht],[x,y+h,z+ht]],top);
  isoPoly([[x,y,z],[x,y+h,z],[x,y+h,z+ht],[x,y,z+ht]],left);
  isoPoly([[x,y,z],[x+w,y,z],[x+w,y,z+ht],[x,y,z+ht]],right);
}
function isoBoxOutline(x,y,z,w,h,ht,color){
  let pts=[[x,y,z+ht],[x+w,y,z+ht],[x+w,y+h,z+ht],[x,y+h,z+ht]];
  let sp=pts.map(p=>w2s(p[0],p[1],p[2]));
  ctx.beginPath();ctx.moveTo(sp[0].x,sp[0].y);
  for(let i=1;i<sp.length;i++)ctx.lineTo(sp[i].x,sp[i].y);
  ctx.closePath();ctx.strokeStyle=color;ctx.lineWidth=1.5;ctx.stroke();
}
let time=0,lastT=performance.now();
let products=[],nextSpawn=0,carts=[],storageProducts=[];
let storageSlots=[];
for(let i=0;i<3;i++)for(let j=0;j<3;j++)for(let k=0;k<3;k++)
  storageSlots.push({x:11.2+i*0.65,y:4.2+j*0.65,z:0.3+k*0.65});
let storageIdx=0;
function initCarts(){
  carts.push({pathT:0,speed:0.06,color:'#00bcd4',loaded:null});
  carts.push({pathT:0.5,speed:0.06,color:'#00bcd4',loaded:null});
}
initCarts();
const cartPath=[{x:9,y:2},{x:9,y:4},{x:2,y:4},{x:2,y:2}];
function getCartPos(t){
  let n=cartPath.length,seg=Math.floor(t*n)%n,st=(t*n)%1;
  let p1=cartPath[seg],p2=cartPath[(seg+1)%n];
  return{x:p1.x+(p2.x-p1.x)*st,y:p1.y+(p2.y-p1.y)*st};
}
let robotArm={baseX:9.5,baseY:2,baseZ:0.4,handX:9,handY:2,handZ:0.5,
  targetX:9,targetY:2,targetZ:0.5,carrying:null,state:'pickup',t:0};
function spawnProduct(){
  products.push({state:'conv1',prog:0,x:0,y:2,z:0.3,size:0.55,
    stamp:0,assem:0,color:'#e8a735',stamped:false,assembled:false});
}
function update(dt){
  time+=dt;
  if(time>nextSpawn){spawnProduct();nextSpawn=time+2.2;}
  for(let p of products){
    switch(p.state){
      case 'conv1':
        p.prog+=dt*0.22;p.x=0+p.prog*3;p.y=2;
        if(p.prog>=1){p.state='stamping';p.prog=0;}
        break;
      case 'stamping':
        p.stamp+=dt*0.35;
        if(p.stamp>=1){p.state='conv2';p.prog=0;p.stamped=true;p.color='#4a9eff';}
        break;
      case 'conv2':
        p.prog+=dt*0.22;p.x=3+p.prog*3;p.y=2;
        if(p.prog>=1){p.state='assembly';p.prog=0;}
        break;
      case 'assembly':
        p.assem+=dt*0.35;
        if(p.assem>=1){p.state='conv3';p.prog=0;p.assembled=true;p.color='#00e676';}
        break;
      case 'conv3':
        p.prog+=dt*0.22;p.x=6+p.prog*3;p.y=2;
        if(p.prog>=1){p.state='waiting';}
        break;
      case 'waiting':
        break;
      case 'stored':
        break;
    }
  }
  for(let c of carts){
    c.pathT+=dt*c.speed;
    if(c.pathT>=1)c.pathT-=1;
    let pos=getCartPos(c.pathT);
    c.x=pos.x;c.y=pos.y;
  }
  let arm=robotArm;
  let dx=arm.targetX-arm.handX,dy=arm.targetY-arm.handY,dz=arm.targetZ-arm.handZ;
  let dist=Math.sqrt(dx*dx+dy*dy+dz*dz);
  if(dist>0.05){
    let spd=dt*1.5;
    arm.handX+=dx*spd;arm.handY+=dy*spd;arm.handZ+=dz*spd;
  }else{
    arm.handX=arm.targetX;arm.handY=arm.targetY;arm.handZ=arm.targetZ;
    if(arm.state==='pickup'){
      let waiting=products.find(p=>p.state==='waiting');
      if(waiting&&!arm.carrying){
        arm.carrying=waiting;waiting.state='carried';
        arm.state='dropoff';arm.targetX=11.2;arm.targetY=4.2;arm.targetZ=0.5;
      }
    }else if(arm.state==='dropoff'){
      if(arm.carrying){
        if(storageIdx<storageSlots.length){
          let slot=storageSlots[storageIdx++];
          arm.carrying.state='stored';arm.carrying.sx=slot.x;arm.carrying.sy=slot.y;arm.carrying.sz=slot.z;
          storageProducts.push(arm.carrying);
        }else{
          arm.carrying.state='stored';arm.carrying.sx=11.2+Math.random()*1.5;
          arm.carrying.sy=4.2+Math.random()*1.5;arm.carrying.sz=0.3;
          storageProducts.push(arm.carrying);
        }
        arm.carrying=null;
        arm.state='pickup';arm.targetX=9;arm.targetY=2;arm.targetZ=0.5;
      }
    }
  }
}
function drawFloor(){
  for(let x=0;x<=12;x++){
    for(let y=0;y<=6;y++){
      let col=(x+y)%2===0?'#1a1e28':'#1e2230';
      isoPoly([[x,y,0],[x+1,y,0],[x+1,y+1,0],[x,y+1,0]],col);
    }
  }
  for(let x=0;x<=12;x++){
    let p1=w2s(x,0),p2=w2s(x,6);
    ctx.beginPath();ctx.moveTo(p1.x,p1.y);ctx.lineTo(p2.x,p2.y);
    ctx.strokeStyle='#2a2e3a';ctx.lineWidth=0.5;ctx.stroke();
  }
  for(let y=0;y<=6;y++){
    let p1=w2s(0,y),p2=w2s(12,y);
    ctx.beginPath();ctx.moveTo(p1.x,p1.y);ctx.lineTo(p2.x,p2.y);
    ctx.strokeStyle='#2a2e3a';ctx.lineWidth=0.5;ctx.stroke();
  }
  isoPoly([[0,6,0],[12,6,0],[12,0,0],[0,0,0]],'#141824');
}
function drawConveyor(x1,y1,x2,y2,wid,col){
  let dx=x2-x1,dy=y2-y1,len=Math.sqrt(dx*dx+dy*dy);
  let nx=-dy/len,ny=dx/len;
  isoPoly([[x1+nx*wid/2,y1+ny*wid/2,0],[x1-nx*wid/2,y1-ny*wid/2,0],
    [x2-nx*wid/2,y2-ny*wid/2,0],[x2+nx*wid/2,y2+ny*wid/2,0]],col);
  let segs=12;
  for(let i=0;i<segs;i++){
    let t=((i+time*0.3)%segs)/segs;
    let px=x1+dx*t,py=y1+dy*t;
    let pa=w2s(px+nx*wid/2,py+ny*wid/2,0.02);
    let pb=w2s(px-nx*wid/2,py-ny*wid/2,0.02);
    ctx.beginPath();ctx.moveTo(pa.x,pa.y);ctx.lineTo(pb.x,pb.y);
    ctx.strokeStyle='#3a3a4a';ctx.lineWidth=1;ctx.stroke();
  }
  let p1=w2s(x1+nx*wid/2,y1+ny*wid/2,0.03),p2=w2s(x1-nx*wid/2,y1-ny*wid/2,0.03);
  let p3=w2s(x2-nx*wid/2,y2-ny*wid/2,0.03),p4=w2s(x2+nx*wid/2,y2+ny*wid/2,0.03);
  ctx.beginPath();ctx.moveTo(p1.x,p1.y);ctx.lineTo(p2.x,p2.y);
  ctx.lineTo(p3.x,p3.y);ctx.lineTo(p4.x,p4.y);
  ctx.strokeStyle='#4a4a5a';ctx.lineWidth=1;ctx.stroke();
}
function drawMachine1(){
  let x=3,y=2,z=0;
  isoBox(x+0.1,y+0.1,z,0.8,0.8,1.2,'#3a4a5a','#2a3a4a','#4a5a6a');
  let pistonH=0.3+Math.abs(Math.sin(time*1.5))*0.4;
  isoBox(x+0.3,y+0.3,z+1.2,0.4,0.4,pistonH,'#ff6b35','#d44a2a','#ff8a55');
  let lp=w2s(x+0.5,y+0.5,z+1.2+pistonH);
  ctx.beginPath();ctx.arc(lp.x,lp.y,6,0,Math.PI*2);ctx.fillStyle='#ffd700';ctx.fill();
  let lightOn=Math.sin(time*3)>0;
  let lp2=w2s(x+0.2,y+0.8,z+1.2);
  ctx.beginPath();ctx.arc(lp2.x,lp2.y,3,0,Math.PI*2);
  ctx.fillStyle=lightOn?'#00ff00':'#003300';ctx.fill();
}
function drawMachine2(){
  let x=6,y=2,z=0;
  isoBox(x+0.1,y+0.1,z,0.8,0.8,1.0,'#2a4a6a','#1a3a5a','#3a5a7a');
  let rot=time*1.2;
  let cx1=x+0.5+Math.cos(rot)*0.3,cy1=y+0.5+Math.sin(rot)*0.3;
  let cx2=x+0.5+Math.cos(rot+Math.PI)*0.3,cy2=y+0.5+Math.sin(rot+Math.PI)*0.3;
  let p1=w2s(cx1,cy1,z+1.0),p2=w2s(cx2,cy2,z+1.0);
  ctx.beginPath();ctx.arc(p1.x,p1.y,4,0,Math.PI*2);ctx.fillStyle='#00bcd4';ctx.fill();
  ctx.beginPath();ctx.arc(p2.x,p2.y,4,0,Math.PI*2);ctx.fillStyle='#00bcd4';ctx.fill();
  let p3=w2s(x+0.5,y+0.5,z+1.0);
  ctx.beginPath();ctx.arc(p3.x,p3.y,8,0,Math.PI*2);ctx.fillStyle='#4a9eff';ctx.fill();
  let lightOn=Math.sin(time*2.5)>0;
  let lp=w2s(x+0.8,y+0.2,z+1.0);
  ctx.beginPath();ctx.arc(lp.x,lp.y,3,0,Math.PI*2);
  ctx.fillStyle=lightOn?'#ff0000':'#330000';ctx.fill();
}
function drawRoboticArm(){
  let arm=robotArm;
  let base=w2s(arm.baseX,arm.baseY,arm.baseZ);
  let hand=w2s(arm.handX,arm.handY,arm.handZ);
  let ex=(arm.baseX+arm.handX)/2,ey=(arm.baseY+arm.handY)/2,ez=(arm.baseZ+arm.handZ)/2+0.6;
  let elbow=w2s(ex,ey,ez);
  isoBox(arm.baseX-0.2,arm.baseY-0.2,0,0.4,0.4,0.4,'#555','#444','#666');
  ctx.beginPath();ctx.arc(base.x,base.y,8,0,Math.PI*2);ctx.fillStyle='#333';ctx.fill();
  ctx.strokeStyle='#ff6b35';ctx.lineWidth=4;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(base.x,base.y);ctx.lineTo(elbow.x,elbow.y);ctx.stroke();
  ctx.strokeStyle='#ffd700';ctx.lineWidth=3;
  ctx.beginPath();ctx.moveTo(elbow.x,elbow.y);ctx.lineTo(hand.x,hand.y);ctx.stroke();
  ctx.beginPath();ctx.arc(hand.x,hand.y,5,0,Math.PI*2);ctx.fillStyle='#ff6b35';ctx.fill();
  ctx.beginPath();ctx.arc(hand.x,hand.y,2,0,Math.PI*2);ctx.fillStyle='#ffd700';ctx.fill();
  if(arm.carrying){
    let cp=w2s(arm.handX,arm.handY,arm.handZ+0.2);
    ctx.beginPath();ctx.arc(cp.x,cp.y,8,0,Math.PI*2);ctx.fillStyle='#00e676';ctx.fill();
  }
}
function drawCart(c){
  let pos=getCartPos(c.pathT);
  let p=w2s(pos.x,pos.y,0);
  isoBox(pos.x-0.25,pos.y-0.25,0,0.5,0.5,0.35,'#0a2a3a','#081a2a','#0c3a4a');
  let lp=w2s(pos.x,pos.y,0.35);
  ctx.beginPath();ctx.arc(lp.x,lp.y,3,0,Math.PI*2);ctx.fillStyle='#00bcd4';ctx.fill();
  if(c.loaded){
    let cp=w2s(pos.x,pos.y,0.4);
    ctx.fillStyle='#00e676';
    ctx.fillRect(cp.x-5,cp.y-5,10,10);
  }
}
function drawProduct(p){
  if(p.state==='stored'){
    isoBox(p.sx-0.2,p.sy-0.2,0,0.4,0.4,p.sz,p.color,'#333','#222');
    return;
  }
  if(p.state==='carried')return;
  let px=p.x,py=p.y,pz=p.z;
  if(p.state==='stamping'){
    let press=Math.sin(p.stamp*Math.PI);
    pz=0.3+press*0.2;
  }
  if(p.state==='assembly'){
    let a=Math.sin(p.assem*Math.PI);
    pz=0.3+a*0.15;
  }
  let sz=p.size;
  isoBox(px-sz/2,py-sz/2,0,sz,sz,pz,p.color,'#2a2a3a','#1a1a2a');
  if(p.stamped){
    let tp=w2s(px,py,pz+0.02);
    ctx.beginPath();ctx.arc(tp.x,tp.y,3,0,Math.PI*2);ctx.fillStyle='#4a9eff';ctx.fill();
  }
  if(p.assembled){
    let tp=w2s(px+0.1,py+0.1,pz+0.05);
    ctx.beginPath();ctx.arc(tp.x,tp.y,2,0,Math.PI*2);ctx.fillStyle='#00e676';ctx.fill();
  }
}
function drawLights(){
  let positions=[[1,1],[1,5],[5,1],[5,5],[8,1],[8,5],[11,1],[11,5]];
  for(let i=0;i<positions.length;i++){
    let [x,y]=positions[i];
    let p=w2s(x,y,0.6);
    let on=Math.sin(time*2+i*1.3)>0;
    ctx.beginPath();ctx.arc(p.x,p.y,4,0,Math.PI*2);
    ctx.fillStyle=on?'#00ff88':'#004422';ctx.fill();
    ctx.beginPath();ctx.arc(p.x,p.y,8,0,Math.PI*2);
    ctx.fillStyle=on?'rgba(0,255,136,0.2)':'rgba(0,68,34,0.1)';ctx.fill();
  }
  let p=w2s(9.5,2,1.5);
  ctx.beginPath();ctx.arc(p.x,p.y,5,0,Math.PI*2);
  ctx.fillStyle=Math.sin(time*4)>0?'#ff4444':'#441111';ctx.fill();
}
function drawStorage(){
  for(let p of storageProducts){
    if(p.state==='stored'){
      isoBox(p.sx-0.18,p.sy-0.18,0,0.36,0.36,p.sz,p.color,'#2a2a3a','#1a1a2a');
    }
  }
  isoPoly([[10.5,3.5,0],[12.5,3.5,0],[12.5,5,0],[10.5,5,0]],'#0e1220');
  isoPoly([[10.5,3.5,0],[12.5,3.5,0],[12.5,5,0],[10.5,5,0]],'#0e1220');
}
function drawFactoryStructure(){
  for(let i=0;i<4;i++){
    let x=0.5+i*3.5;
    let p1=w2s(x,0,0),p2=w2s(x,0,2.5);
    ctx.beginPath();ctx.moveTo(p1.x,p1.y);ctx.lineTo(p2.x,p2.y);
    ctx.strokeStyle='#3a4a5a';ctx.lineWidth=3;ctx.stroke();
    let p3=w2s(x,6,0),p4=w2s(x,6,2.5);
    ctx.beginPath();ctx.moveTo(p3.x,p3.y);ctx.lineTo(p4.x,p4.y);
    ctx.strokeStyle='#3a4a5a';ctx.lineWidth=3;ctx.stroke();
  }
  let p1=w2s(0,0,2.5),p2=w2s(12,0,2.5);
  ctx.beginPath();ctx.moveTo(p1.x,p1.y);ctx.lineTo(p2.x,p2.y);
  ctx.strokeStyle='#3a4a5a';ctx.lineWidth=2;ctx.stroke();
  let p3=w2s(0,6,2.5),p4=w2s(12,6,2.5);
  ctx.beginPath();ctx.moveTo(p3.x,p3.y);ctx.lineTo(p4.x,p4.y);
  ctx.strokeStyle='#3a4a5a';ctx.lineWidth=2;ctx.stroke();
}
function render(){
  ctx.fillStyle='#0a0e14';ctx.fillRect(0,0,W,H);
  let grad=ctx.createRadialGradient(W/2,H/3,50,W/2,H/2,W/1.5);
  grad.addColorStop(0,'#0d1117');grad.addColorStop(1,'#060a0f');
  ctx.fillStyle=grad;ctx.fillRect(0,0,W,H);
  drawFloor();
  drawFactoryStructure();
  drawConveyor(0,2,3,2,0.6,'#1a1a2a');
  drawConveyor(3,2,6,2,0.6,'#1a1a2a');
  drawConveyor(6,2,9,2,0.6,'#1a1a2a');
  drawMachine1();
  drawMachine2();
  drawStorage();
  for(let p of products)drawProduct(p);
  drawRoboticArm();
  for(let c of carts)drawCart(c);
  drawLights();
  let rawPos=w2s(0,2,0.2);
  isoBox(-0.3,1.7,0,0.6,0.6,0.8,'#8a7a5a','#6a5a3a','#7a6a4a');
  isoBox(-0.1,1.9,0.4,0.5,0.5,0.5,'#8a7a5a','#6a5a3a','#7a6a4a');
  let txt=w2s(6,0.5,0.1);
  ctx.fillStyle='#4a9eff';ctx.font='bold 14px monospace';
  ctx.textAlign='center';
  ctx.fillText('AUTO-FACTORY v2.0',txt.x,txt.y);
}
function loop(t){
  let dt=Math.min((t-lastT)/1000,0.05);
  lastT=t;
  update(dt);
  render();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
