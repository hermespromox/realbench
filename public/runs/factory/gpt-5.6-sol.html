<title>Autonomous Isometric Factory</title>
<style>
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07101d}
  body{font-family:Arial,Helvetica,sans-serif}
  svg{display:block;width:100vw;height:100vh}
  .belt-mark{stroke-dasharray:24 18;animation:belt 1.1s linear infinite}
  .belt-mark.reverse{animation-direction:reverse}
  @keyframes belt{to{stroke-dashoffset:-42}}
  .pulse{animation:pulse 1.4s ease-in-out infinite}
  .pulse2{animation:pulse 1.4s ease-in-out .7s infinite}
  @keyframes pulse{0%,100%{opacity:.25}50%{opacity:1}}
  .screenline{animation:scan 3.2s linear infinite}
  @keyframes scan{0%{transform:translateY(-22px);opacity:0}12%,85%{opacity:.85}100%{transform:translateY(42px);opacity:0}}
  .fan{transform-origin:center;transform-box:fill-box;animation:spin 2s linear infinite}
  .fan.fast{animation-duration:.7s}
  @keyframes spin{to{transform:rotate(360deg)}}
  .armA{transform-origin:724px 398px;animation:armA 6s cubic-bezier(.55,.05,.45,.95) infinite}
  .foreA{transform-origin:783px 351px;animation:foreA 6s cubic-bezier(.55,.05,.45,.95) infinite}
  .gripA{transform-origin:818px 403px;animation:gripA 6s ease-in-out infinite}
  @keyframes armA{0%,14%,86%,100%{transform:rotate(-17deg)}30%,47%{transform:rotate(19deg)}62%,76%{transform:rotate(7deg)}}
  @keyframes foreA{0%,14%,86%,100%{transform:rotate(25deg)}30%,47%{transform:rotate(-40deg)}62%,76%{transform:rotate(-8deg)}}
  @keyframes gripA{0%,28%,49%,100%{transform:scaleX(1)}34%,44%{transform:scaleX(.55)}}
  .armB{transform-origin:895px 390px;animation:armB 6s cubic-bezier(.5,.05,.5,.95) -3s infinite}
  .foreB{transform-origin:942px 348px;animation:foreB 6s cubic-bezier(.5,.05,.5,.95) -3s infinite}
  @keyframes armB{0%,16%,88%,100%{transform:rotate(18deg)}31%,48%{transform:rotate(-18deg)}64%,78%{transform:rotate(-4deg)}}
  @keyframes foreB{0%,16%,88%,100%{transform:rotate(-28deg)}31%,48%{transform:rotate(43deg)}64%,78%{transform:rotate(10deg)}}
  .press{animation:press 6s cubic-bezier(.5,0,.35,1) infinite}
  @keyframes press{0%,20%,42%,100%{transform:translateY(0)}26%,35%{transform:translateY(52px)}}
  .pressGlow{animation:pressglow 6s linear infinite}
  @keyframes pressglow{0%,24%,37%,100%{opacity:0}27%,34%{opacity:1}}
  .welder{animation:welder 6s linear -1.2s infinite}
  @keyframes welder{0%,41%,54%,100%{opacity:0}43%,45%,48%,51%{opacity:1}44%,47%,50%,53%{opacity:.15}}
  .lift{animation:lift 4.5s ease-in-out infinite}
  @keyframes lift{0%,100%{transform:translateY(0)}45%,58%{transform:translateY(-18px)}}
  .blink{animation:blink 1s steps(1) infinite}
  .blinkSlow{animation:blink 2.2s steps(1) infinite}
  @keyframes blink{0%,48%{opacity:1}49%,100%{opacity:.18}}
  .data{stroke-dasharray:3 8;animation:data 1s linear infinite}
  @keyframes data{to{stroke-dashoffset:-22}}
  .smoke{animation:smoke 5s ease-out infinite}
  .smoke.s2{animation-delay:-1.7s}.smoke.s3{animation-delay:-3.4s}
  @keyframes smoke{0%{transform:translate(0,0) scale(.4);opacity:0}15%{opacity:.3}100%{transform:translate(15px,-70px) scale(1.6);opacity:0}}
  .package1{animation:stack 8s ease-in-out infinite}
  .package2{animation:stack 8s ease-in-out -2s infinite}
  .package3{animation:stack 8s ease-in-out -4s infinite}
  .package4{animation:stack 8s ease-in-out -6s infinite}
  @keyframes stack{0%,7%{opacity:0;transform:translateY(-15px)}12%,82%{opacity:1;transform:none}88%,100%{opacity:0;transform:translate(15px,8px)}}
  .spark{animation:spark .75s ease-out infinite;transform-origin:850px 482px}
  .spark.s2{animation-delay:-.25s}.spark.s3{animation-delay:-.5s}
  @keyframes spark{0%{opacity:1;transform:scale(.2)}100%{opacity:0;transform:scale(1.9)}}
</style>
</head>
