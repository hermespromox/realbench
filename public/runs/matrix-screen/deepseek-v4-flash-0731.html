<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matrix Digital Rain</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html,
        body {
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
        }
        canvas {
            display: block;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1;
        }
        #scanlines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            background: repeating-linear-gradient(to bottom,
                    rgba(0, 0, 0, 0.08) 0px,
                    rgba(0, 0, 0, 0.08) 1px,
                    transparent 1px,
                    transparent 3px);
            pointer-events: none;
        }
    </style>
</head>
<body>
    <canvas id="matrix"></canvas>
    <div id="scanlines"></div>
    <script>
        (function() {
            'use strict';

            const canvas = document.getElementById('matrix');
            const ctx = canvas.getContext('2d');

            // ── Configuration ──
            const FONT_SIZE = 16;
            const CELL_WIDTH = 16;
            const CELL_HEIGHT = 18;
            const TRAIL_SMOOTH = 5;
            const BRIGHTNESS_THRESHOLD = 0.02;
            const MUTATION_RATE = 0.04;

            // ── Glyph set (katakana + latin + digits + symbols) ──
            const GLYPHS =
                'アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワヲン' +
                '0123456789' +
                'ABCDEFGHIJKLMNOPQRSTUVWXYZ' +
                '@#$%&*+-=<>/\\|:;?~[]{}()';

            function randGlyph() {
                return GLYPHS[(Math.random() * GLYPHS.length) | 0];
            }

            // ── State ──
            let W = 0,
                H = 0;
            let cols = 0,
                rows = 0;
            let grid = [];
            let bright = [];
            let headY = [];
            let lastRow = [];
            let speed = [];
            let decay = [];
            let lastTime = performance.now();

            // ── Init / Resize ──
            function init() {
                const dpr = window.devicePixelRatio || 1;
                W = window.innerWidth;
                H = window.innerHeight;
                canvas.width = W * dpr;
                canvas.height = H * dpr;
                canvas.style.width = W + 'px';
                canvas.style.height = H + 'px';
                ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

                cols = Math.ceil(W / CELL_WIDTH);
                rows = Math.ceil(H / CELL_HEIGHT) + 2;

                grid = [];
                bright = [];
                headY = new Array(cols);
                lastRow = new Array(cols);
                speed = new Array(cols);
                decay = new Array(cols);

                for (let c = 0; c < cols; c++) {
                    const gRow = new Array(rows);
                    const bRow = new Array(rows);
                    for (let r = 0; r < rows; r++) {
                        gRow[r] = randGlyph();
                        bRow[r] = 0;
                    }
                    grid.push(gRow);
                    bright.push(bRow);

                    // Start positions spread across the viewport
                    headY[c] = Math.random() * rows;
                    lastRow[c] = Math.floor(headY[c]);
                    speed[c] = 0.2 + Math.random() * 2.0;
                    decay[c] = 0.80 + Math.random() * 0.15;

                    // Pre-populate a visible trail
                    const hRow = Math.floor(headY[c]);
                    const trailLen = 12 + Math.random() * 18;
                    for (let j = 1; j <= trailLen; j++) {
                        const r = hRow - j;
                        if (r >= 0 && r < rows) {
                            bright[c][r] = Math.pow(decay[c], j) * (0.6 + Math.random() * 0.4);
                        }
                    }
                }

                ctx.fillStyle = '#000';
                ctx.fillRect(0, 0, W, H);
            }

            // ── The Animation ──
            function update(dt) {
                // Clear to pure black
                ctx.fillStyle = '#000';
                ctx.fillRect(0, 0, W, H);

                ctx.font = 'bold ' + FONT_SIZE + 'px monospace';
                ctx.textBaseline = 'top';
                ctx.textAlign = 'center';

                for (let c = 0; c < cols; c++) {
                    const d = decay[c];

                    // 1) Decay all cells in this column
                    for (let r = 0; r < rows; r++) {
                        if (bright[c][r] > BRIGHTNESS_THRESHOLD) {
                            bright[c][r] *= d;
                            if (bright[c][r] < BRIGHTNESS_THRESHOLD) bright[c][r] = 0;
                        }
                    }

                    // 2) Advance the head
                    headY[c] += speed[c] * dt * 60;
                    const hRow = Math.floor(headY[c]);

                    // 3) Rows crossed by the head become bright
                    for (let r = lastRow[c] + 1; r <= hRow; r++) {
                        if (r >= 0 && r < rows) {
                            grid[c][r] = randGlyph();
                            bright[c][r] = 1.0;
                        }
                    }
                    lastRow[c] = hRow;

                    // 4) Maintain a smooth bright trail near the head
                    for (let j = 1; j <= TRAIL_SMOOTH; j++) {
                        const r = hRow - j;
                        if (r >= 0 && r < rows) {
                            const target = Math.pow(d, j);
                            if (bright[c][r] < target) {
                                bright[c][r] = target;
                                grid[c][r] = randGlyph();
                            }
                        }
                    }

                    // 5) Randomly mutate glyphs in the trailing region
                    const start = Math.max(0, hRow - 45);
                    for (let r = start; r < hRow && r < rows; r++) {
                        if (Math.random() < MUTATION_RATE) {
                            grid[c][r] = randGlyph();
                        }
                    }

                    // 6) Reset the column when it has fallen past the bottom
                    if (hRow > rows + 5) {
                        headY[c] = Math.random() * 10;
                        lastRow[c] = Math.floor(headY[c]);
                        speed[c] = 0.2 + Math.random() * 2.0;
                        decay[c] = 0.80 + Math.random() * 0.15;

                        for (let r = 0; r < rows; r++) {
                            bright[c][r] = 0;
                        }

                        // Pre-populate fresh trail after reset
                        const nhRow = Math.floor(headY[c]);
                        for (let j = 1; j <= TRAIL_SMOOTH; j++) {
                            const r = nhRow - j;
                            if (r >= 0 && r < rows) {
                                bright[c][r] = Math.pow(decay[c], j) * (0.7 + Math.random() * 0.3);
                                grid[c][r] = randGlyph();
                            }
                        }
                    }
                }

                // ── Draw all columns ──
                for (let c = 0; c < cols; c++) {
                    const x = c * CELL_WIDTH + CELL_WIDTH / 2;
                    const hRow = Math.floor(headY[c]);

                    for (let r = 0; r < rows; r++) {
                        const b = bright[c][r];
                        if (b <= BRIGHTNESS_THRESHOLD) continue;

                        const y = r * CELL_HEIGHT;

                        if (r === hRow && hRow >= 0 && hRow < rows) {
                            // Leading glyph — brightest white-green
                            ctx.fillStyle = 'rgba(230, 255, 230, ' + Math.min(1, b) + ')';
                        } else if (r === hRow - 1) {
                            // Second glyph — very bright green
                            ctx.fillStyle = 'rgba(130, 255, 140, ' + b + ')';
                        } else {
                            // Trail — phosphor green fading to dark green / black
                            const g = Math.min(255, Math.floor(235 * Math.pow(b, 0.8)));
                            const bl = Math.min(70, Math.floor(65 * b));
                            ctx.fillStyle = 'rgb(0, ' + g + ', ' + bl + ')';
                        }

                        ctx.fillText(grid[c][r], x, y);
                    }
                }
            }

            // ── Main Loop ──
            function frame(now) {
                const dt = Math.min((now - lastTime) / 1000, 0.05);
                lastTime = now;
                update(dt);
                requestAnimationFrame(frame);
            }

            // ── Events ──
            window.addEventListener('resize', init);

            // ── Start ──
            init();
            requestAnimationFrame(frame);
        })();
    </script>
</body>
</html>
