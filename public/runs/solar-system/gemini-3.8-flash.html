<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cinematic Solar System</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
  }
  body, html {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background-color: #020208;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  #canvas-container {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
  }
  .hud {
    position: absolute;
    top: 24px;
    left: 28px;
    color: rgba(220, 235, 255, 0.85);
    text-transform: uppercase;
    letter-spacing: 3px;
    pointer-events: none;
    z-index: 10;
  }
  .hud h1 {
    font-size: 15px;
    font-weight: 600;
    margin: 0 0 4px 0;
    color: #ffffff;
    text-shadow: 0 0 12px rgba(120, 190, 255, 0.6);
  }
  .hud p {
    font-size: 9px;
    color: rgba(180, 205, 240, 0.5);
    letter-spacing: 2px;
  }
  .telemetry {
    position: absolute;
    bottom: 24px;
    left: 28px;
    font-family: "Courier New", Courier, monospace;
    font-size: 10px;
    letter-spacing: 1.5px;
    color: rgba(160, 200, 255, 0.45);
    line-height: 1.6;
    pointer-events: none;
    z-index: 10;
  }
  .controls-hint {
    position: absolute;
    bottom: 24px;
    right: 28px;
    font-size: 9px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: rgba(160, 200, 255, 0.35);
    pointer-events: none;
    text-align: right;
    z-index: 10;
  }
  .vignette {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    box-shadow: inset 0 0 120px rgba(0, 0, 0, 0.85);
    pointer-events: none;
    z-index: 5;
  }
</style>
</head>
<body>
<div id="canvas-container">
  <canvas id="space"></canvas>
</div>
<div class="vignette"></div>

<div class="hud">
  <h1>Solar System Simulation</h1>
  <p>Heliocentric Ephemeris Engine // Real-Time Depth Matrix</p>
</div>

<div class="telemetry" id="telemetry">
  SYSTEM: SOL // TILT: 58.5°<br>
  ACTIVE BODIES: 8 PLANETS // 14 SATELLITES<br>
  WARP DRIFT: STABLE &bull; CONTINUOUS
</div>

<div class="controls-hint">
  Interactive Orbit Viewport<br>
  Drag to Tilt &bull; Scroll to Zoom
</div>

<script>
(function() {
  const canvas = document.getElementById('space');
  const ctx = canvas.getContext('2d');

  let width = 0;
  let height = 0;
  let dpr = 1;

  function resize() {
    dpr = window.devicePixelRatio || 1;
    width = window.innerWidth;
    height = window.innerHeight;
    canvas.width = width * dpr;
    canvas.height = height * dpr;
    ctx.scale(dpr, dpr);
  }
  window.addEventListener('resize', resize);
  resize();

  // Camera & view configuration
  const camera = {
    yaw: 0.15,
    pitch: 58.5 * Math.PI / 180, // inclined viewing angle for 3D depth
    distance: 1.0,
    targetDistance: 1.0,
    panX: 0,
    panY: 0,
    isDragging: false,
    lastMouseX: 0,
    lastMouseY: 0,
    autoRotateSpeed: 0.00035
  };

  // Mouse / Touch interaction
  window.addEventListener('mousedown', (e) => {
    camera.isDragging = true;
    camera.lastMouseX = e.clientX;
    camera.lastMouseY = e.clientY;
  });

  window.addEventListener('mousemove', (e) => {
    if (!camera.isDragging) return;
    const dx = e.clientX - camera.lastMouseX;
    const dy = e.clientY - camera.lastMouseY;
    camera.yaw += dx * 0.005;
    camera.pitch = Math.max(0.15, Math.min(Math.PI / 2 - 0.05, camera.pitch + dy * 0.005));
    camera.lastMouseX = e.clientX;
    camera.lastMouseY = e.clientY;
  });

  window.addEventListener('mouseup', () => camera.isDragging = false);
  window.addEventListener('mouseleave', () => camera.isDragging = false);

  window.addEventListener('wheel', (e) => {
    e.preventDefault();
    const zoomFactor = e.deltaY > 0 ? 0.92 : 1.08;
    camera.targetDistance = Math.max(0.4, Math.min(2.4, camera.targetDistance * zoomFactor));
  }, { passive: false });

  // Touch support
  let touchStartDist = 0;
  window.addEventListener('touchstart', (e) => {
    if (e.touches.length === 1) {
      camera.isDragging = true;
      camera.lastMouseX = e.touches[0].clientX;
      camera.lastMouseY = e.touches[0].clientY;
    } else if (e.touches.length === 2) {
      touchStartDist = Math.hypot(
        e.touches[0].clientX - e.touches[1].clientX,
        e.touches[0].clientY - e.touches[1].clientY
      );
    }
  });

  window.addEventListener('touchmove', (e) => {
    if (e.touches.length === 1 && camera.isDragging) {
      const dx = e.touches[0].clientX - camera.lastMouseX;
      const dy = e.touches[0].clientY - camera.lastMouseY;
      camera.yaw += dx * 0.005;
      camera.pitch = Math.max(0.15, Math.min(Math.PI / 2 - 0.05, camera.pitch + dy * 0.005));
      camera.lastMouseX = e.touches[0].clientX;
      camera.lastMouseY = e.touches[0].clientY;
    } else if (e.touches.length === 2) {
      const dist = Math.hypot(
        e.touches[0].clientX - e.touches[1].clientX,
        e.touches[0].clientY - e.touches[1].clientY
      );
      const ratio = dist / touchStartDist;
      camera.targetDistance = Math.max(0.4, Math.min(2.4, camera.targetDistance * (ratio > 1 ? 1.03 : 0.97)));
      touchStartDist = dist;
    }
  }, { passive: false });

  window.addEventListener('touchend', () => camera.isDragging = false);

  // Deep Starfield Background
  const STAR_COUNT = 750;
  const stars = [];
  for (let i = 0; i < STAR_COUNT; i++) {
    const phi = Math.acos(2 * Math.random() - 1);
    const theta = 2 * Math.PI * Math.random();
    const r = 1800 + Math.random() * 400;
    stars.push({
      x: r * Math.sin(phi) * Math.cos(theta),
      y: r * Math.sin(phi) * Math.sin(theta),
      z: r * Math.cos(phi),
      size: Math.random() * 1.5 + 0.4,
      baseAlpha: 0.2 + Math.random() * 0.8,
      twinkleSpeed: 0.02 + Math.random() * 0.05,
      twinklePhase: Math.random() * Math.PI * 2,
      color: ['#ffffff', '#d6e4ff', '#ffebd6', '#e0ecff', '#ffe1bb'][Math.floor(Math.random() * 5)]
    });
  }

  // Nebula clouds (subtle dust backdrops)
  const nebulae = [
    { x: -350, y: -220, z: -800, radius: 450, color: 'rgba(50, 20, 100, 0.12)' },
    { x: 420, y: 180, z: -900, radius: 550, color: 'rgba(15, 60, 110, 0.14)' },
    { x: -100, y: 350, z: -850, radius: 480, color: 'rgba(80, 25, 60, 0.09)' },
    { x: 300, y: -300, z: -750, radius: 380, color: 'rgba(10, 80, 90, 0.1)' }
  ];

  // Shooting Stars
  const shootingStars = [];
  function spawnShootingStar() {
    if (Math.random() < 0.015 && shootingStars.length < 3) {
      shootingStars.push({
        x: (Math.random() - 0.5) * width * 1.5,
        y: -height * 0.6 + (Math.random() - 0.5) * 300,
        z: (Math.random() - 0.5) * 800,
        vx: 8 + Math.random() * 12,
        vy: 5 + Math.random() * 8,
        length: 80 + Math.random() * 100,
        life: 1.0,
        decay: 0.015 + Math.random() * 0.02
      });
    }
  }

  // Celestial Bodies Definition
  // Distances and speeds are stylized for clear aesthetics and continuous graceful choreography
  const planets = [
    {
      name: 'Mercury',
      distance: 90,
      radius: 3.4,
      speed: 0.0415,
      angle: 0.6,
      color: '#a8a59b',
      shadowColor: '#1d1a18',
      features: { bands: false },
      moons: []
    },
    {
      name: 'Venus',
      distance: 135,
      radius: 6.8,
      speed: 0.0162,
      angle: 1.8,
      color: '#e3bb7b',
      shadowColor: '#2b1b0b',
      atmosphere: 'rgba(255, 230, 170, 0.25)',
      features: { bands: true, bandColors: ['#d1ab6f', '#e6c88f', '#be985e'] },
      moons: []
    },
    {
      name: 'Earth',
      distance: 195,
      radius: 7.2,
      speed: 0.01,
      angle: 3.2,
      color: '#287ab8',
      shadowColor: '#0a1a2e',
      atmosphere: 'rgba(100, 200, 255, 0.4)',
      clouds: true,
      moons: [
        { name: 'Moon', distance: 16, radius: 1.8, speed: 0.08, angle: 0, color: '#d0d0d5' }
      ]
    },
    {
      name: 'Mars',
      distance: 255,
      radius: 4.8,
      speed: 0.0053,
      angle: 4.5,
      color: '#c85a32',
      shadowColor: '#240b04',
      atmosphere: 'rgba(230, 120, 80, 0.2)',
      features: { polarCap: true },
      moons: [
        { name: 'Phobos', distance: 10, radius: 0.9, speed: 0.12, angle: 1.2, color: '#998d85' },
        { name: 'Deimos', distance: 14, radius: 0.7, speed: 0.07, angle: 4.1, color: '#8c8078' }
      ]
    },
    {
      name: 'Jupiter',
      distance: 350,
      radius: 17.5,
      speed: 0.0022,
      angle: 0.2,
      color: '#c99e74',
      shadowColor: '#241407',
      atmosphere: 'rgba(230, 180, 130, 0.2)',
      features: {
        bands: true,
        greatRedSpot: true,
        bandColors: ['#a57951', '#d4af86', '#875d38', '#dfbe97', '#734d2c', '#cba279']
      },
      moons: [
        { name: 'Io', distance: 26, radius: 1.5, speed: 0.065, angle: 0.4, color: '#f3d359' },
        { name: 'Europa', distance: 32, radius: 1.3, speed: 0.045, angle: 1.9, color: '#c5b8a5' },
        { name: 'Ganymede', distance: 40, radius: 2.1, speed: 0.028, angle: 3.5, color: '#8b8077' },
        { name: 'Callisto', distance: 49, radius: 1.9, speed: 0.016, angle: 5.1, color: '#686058' }
      ]
    },
    {
      name: 'Saturn',
      distance: 460,
      radius: 14.5,
      speed: 0.0012,
      angle: 2.7,
      color: '#e2bf7d',
      shadowColor: '#241908',
      atmosphere: 'rgba(235, 205, 150, 0.2)',
      features: {
        bands: true,
        bandColors: ['#cfab69', '#ebd097', '#b89452', '#dac088']
      },
      rings: {
        innerRadius: 18,
        outerRadius: 36,
        color1: 'rgba(215, 185, 135, 0.7)',
        color2: 'rgba(165, 135, 95, 0.5)',
        tilt: 0.42
      },
      moons: [
        { name: 'Titan', distance: 48, radius: 2.2, speed: 0.025, angle: 1.1, color: '#d99c43' },
        { name: 'Enceladus', distance: 28, radius: 1.0, speed: 0.055, angle: 3.8, color: '#eef5fc' },
        { name: 'Rhea', distance: 36, radius: 1.2, speed: 0.038, angle: 5.4, color: '#afabb2' }
      ]
    },
    {
      name: 'Uranus',
      distance: 555,
      radius: 10.5,
      speed: 0.0007,
      angle: 5.2,
      color: '#6fe3e1',
      shadowColor: '#0b262b',
      atmosphere: 'rgba(130, 240, 240, 0.3)',
      rings: {
        innerRadius: 13,
        outerRadius: 18,
        color1: 'rgba(175, 230, 235, 0.35)',
        color2: 'rgba(110, 185, 195, 0.15)',
        tilt: 1.45
      },
      moons: [
        { name: 'Titania', distance: 23, radius: 1.3, speed: 0.035, angle: 0.8, color: '#c9cbcd' },
        { name: 'Oberon', distance: 29, radius: 1.2, speed: 0.025, angle: 2.4, color: '#b5aba7' }
      ]
    },
    {
      name: 'Neptune',
      distance: 640,
      radius: 10.0,
      speed: 0.00045,
      angle: 3.9,
      color: '#3457d5',
      shadowColor: '#070f30',
      atmosphere: 'rgba(80, 140, 255, 0.35)',
      features: { bands: true, bandColors: ['#2845b5', '#4169e1', '#1f3898'] },
      moons: [
        { name: 'Triton', distance: 25, radius: 1.5, speed: -0.032, angle: 1.5, color: '#a6c2cc' }
      ]
    }
  ];

  // 3D Projection Helpers
  function project(x, y, z) {
    // Rotate by camera yaw around Y axis
    const cosY = Math.cos(camera.yaw);
    const sinY = Math.sin(camera.yaw);
    const x1 = x * cosY - z * sinY;
    const z1 = x * sinY + z * cosY;

    // Rotate by camera pitch around X axis
    const cosP = Math.cos(camera.pitch);
    const sinP = Math.sin(camera.pitch);
    const y2 = y * cosP - z1 * sinP;
    const z2 = y * sinP + z1 * cosP;

    // Perspective projection
    const fov = 850 * camera.distance;
    const depth = fov / (fov + z2 * 0.65);
    
    return {
      x: width / 2 + x1 * depth + camera.panX,
      y: height / 2 + y2 * depth + camera.panY,
      scale: depth,
      rawZ: z2
    };
  }

  // Procedural Noise Generator for Sun's Surface
  function generateSunTexture() {
    const size = 128;
    const sunTexCanvas = document.createElement('canvas');
    sunTexCanvas.width = size;
    sunTexCanvas.height = size;
    const sctx = sunTexCanvas.getContext('2d');

    const grad = sctx.createRadialGradient(size/2, size/2, 0, size/2, size/2, size/2);
    grad.addColorStop(0, '#ffffff');
    grad.addColorStop(0.2, '#fff1a8');
    grad.addColorStop(0.5, '#ff9e1b');
    grad.addColorStop(0.8, '#e64205');
    grad.addColorStop(1, '#660b00');
    sctx.fillStyle = grad;
    sctx.fillRect(0, 0, size, size);

    return sunTexCanvas;
  }
  const sunTexture = generateSunTexture();

  let globalTime = 0;

  // Render Background
  function renderBackground() {
    // Deep spatial gradient
    const bgGrad = ctx.createRadialGradient(
      width / 2, height / 2, 50,
      width / 2, height / 2, Math.max(width, height) * 0.75
    );
    bgGrad.addColorStop(0, '#060714');
    bgGrad.addColorStop(0.5, '#020309');
    bgGrad.addColorStop(1, '#000104');
    ctx.fillStyle = bgGrad;
    ctx.fillRect(0, 0, width, height);

    // Subtle drifting nebulae
    for (const neb of nebulae) {
      const p = project(neb.x, neb.y, neb.z);
      if (p.scale > 0) {
        ctx.save();
        const rad = neb.radius * p.scale;
        const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, rad);
        g.addColorStop(0, neb.color);
        g.addColorStop(1, 'transparent');
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.arc(p.x, p.y, rad, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }

    // Stars with 3D parallax & twinkling
    for (let i = 0; i < stars.length; i++) {
      const s = stars[i];
      // Slow rotation for background drift
      const driftAngle = globalTime * 0.00008;
      const xRot = s.x * Math.cos(driftAngle) - s.z * Math.sin(driftAngle);
      const zRot = s.x * Math.sin(driftAngle) + s.z * Math.cos(driftAngle);

      const p = project(xRot, s.y, zRot);
      if (p.scale > 0 && p.x >= 0 && p.x <= width && p.y >= 0 && p.y <= height) {
        const twinkle = Math.sin(globalTime * s.twinkleSpeed + s.twinklePhase) * 0.3 + 0.7;
        const alpha = Math.min(1, Math.max(0.1, s.baseAlpha * twinkle * (p.scale * 1.2)));
        ctx.fillStyle = s.color;
        ctx.globalAlpha = alpha;
        ctx.beginPath();
        ctx.arc(p.x, p.y, s.size * Math.min(p.scale * 1.2, 1.8), 0, Math.PI * 2);
        ctx.fill();
      }
    }
    ctx.globalAlpha = 1.0;

    // Shooting stars
    spawnShootingStar();
    for (let i = shootingStars.length - 1; i >= 0; i--) {
      const ss = shootingStars[i];
      ss.x += ss.vx;
      ss.y += ss.vy;
      ss.life -= ss.decay;
      if (ss.life <= 0) {
        shootingStars.splice(i, 1);
        continue;
      }
      ctx.strokeStyle = `rgba(220, 240, 255, ${ss.life * 0.8})`;
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(ss.x, ss.y);
      ctx.lineTo(ss.x - ss.vx * 3.5, ss.y - ss.vy * 3.5);
      ctx.stroke();
    }
  }

  // Render Subtle Orbital Paths
  function renderOrbitPath(radius) {
    const segments = 120;
    ctx.beginPath();
    for (let i = 0; i <= segments; i++) {
      const theta = (i / segments) * Math.PI * 2;
      const ox = radius * Math.cos(theta);
      const oz = radius * Math.sin(theta);
      const p = project(ox, 0, oz);
      if (i === 0) ctx.moveTo(p.x, p.y);
      else ctx.lineTo(p.x, p.y);
    }
    ctx.strokeStyle = 'rgba(100, 160, 240, 0.08)';
    ctx.lineWidth = 1.0;
    ctx.stroke();
  }

  // Render Sun & Corona
  function renderSun(centerProj) {
    const sunRadius = 26 * centerProj.scale;

    ctx.save();

    // 1. Far Corona Rays / Anamorphic light streaks
    const flareLen = 140 * centerProj.scale;
    const flareGrad = ctx.createLinearGradient(
      centerProj.x - flareLen, centerProj.y,
      centerProj.x + flareLen, centerProj.y
    );
    flareGrad.addColorStop(0, 'rgba(255, 170, 60, 0)');
    flareGrad.addColorStop(0.3, 'rgba(255, 140, 40, 0.08)');
    flareGrad.addColorStop(0.5, 'rgba(255, 235, 180, 0.28)');
    flareGrad.addColorStop(0.7, 'rgba(255, 140, 40, 0.08)');
    flareGrad.addColorStop(1, 'rgba(255, 170, 60, 0)');

    ctx.fillStyle = flareGrad;
    ctx.fillRect(centerProj.x - flareLen, centerProj.y - 2 * centerProj.scale, flareLen * 2, 4 * centerProj.scale);

    // 2. Wide pulsating Atmospheric Glow
    const pulse = 1 + Math.sin(globalTime * 0.04) * 0.035;
    const glowRadius = sunRadius * 4.6 * pulse;
    const glowGrad = ctx.createRadialGradient(
      centerProj.x, centerProj.y, sunRadius * 0.8,
      centerProj.x, centerProj.y, glowRadius
    );
    glowGrad.addColorStop(0, 'rgba(255, 200, 80, 0.45)');
    glowGrad.addColorStop(0.25, 'rgba(255, 120, 20, 0.25)');
    glowGrad.addColorStop(0.6, 'rgba(240, 60, 0, 0.08)');
    glowGrad.addColorStop(1, 'rgba(200, 20, 0, 0)');

    ctx.fillStyle = glowGrad;
    ctx.beginPath();
    ctx.arc(centerProj.x, centerProj.y, glowRadius, 0, Math.PI * 2);
    ctx.fill();

    // 3. Solar Prominences / Flares (curving loops)
    ctx.strokeStyle = 'rgba(255, 140, 30, 0.6)';
    ctx.lineWidth = 1.5 * centerProj.scale;
    for (let i = 0; i < 5; i++) {
      const angle = (i * (Math.PI * 2 / 5)) + globalTime * 0.005;
      const pLen = sunRadius * (1.1 + 0.15 * Math.sin(globalTime * 0.08 + i * 2));
      const px = centerProj.x + Math.cos(angle) * pLen;
      const py = centerProj.y + Math.sin(angle) * pLen;
      ctx.beginPath();
      ctx.arc(px, py, 4 * centerProj.scale, 0, Math.PI);
      ctx.stroke();
    }

    // 4. Sun Core Body with rotating turbulence illusion
    ctx.save();
    ctx.beginPath();
    ctx.arc(centerProj.x, centerProj.y, sunRadius, 0, Math.PI * 2);
    ctx.clip();
    
    // Draw base sun texture
    ctx.drawImage(
      sunTexture,
      centerProj.x - sunRadius,
      centerProj.y - sunRadius,
      sunRadius * 2,
      sunRadius * 2
    );

    // Dynamic solar surface layer
    const coreGrad = ctx.createRadialGradient(
      centerProj.x - sunRadius * 0.2, centerProj.y - sunRadius * 0.2, sunRadius * 0.1,
      centerProj.x, centerProj.y, sunRadius
    );
    coreGrad.addColorStop(0, '#ffffff');
    coreGrad.addColorStop(0.3, '#fff4b3');
    coreGrad.addColorStop(0.7, '#ff9900');
    coreGrad.addColorStop(1, '#e03a00');
    ctx.fillStyle = coreGrad;
    ctx.fill();
    ctx.restore();

    // Inner bright hot rim
    ctx.strokeStyle = 'rgba(255, 255, 220, 0.9)';
    ctx.lineWidth = 1.5 * centerProj.scale;
    ctx.beginPath();
    ctx.arc(centerProj.x, centerProj.y, sunRadius, 0, Math.PI * 2);
    ctx.stroke();

    ctx.restore();
  }

  // Render Rings for Saturn / Uranus
  function renderPlanetRings(ringInfo, proj, planetRadius, isBackHalf) {
    const rxInner = ringInfo.innerRadius * proj.scale;
    const ryInner = ringInfo.innerRadius * proj.scale * Math.sin(camera.pitch) * Math.cos(ringInfo.tilt);
    const rxOuter = ringInfo.outerRadius * proj.scale;
    const ryOuter = ringInfo.outerRadius * proj.scale * Math.sin(camera.pitch) * Math.cos(ringInfo.tilt);

    ctx.save();
    ctx.translate(proj.x, proj.y);

    // Split rendering: back half before planet, front half after planet
    ctx.beginPath();
    if (isBackHalf) {
      // Top/back half
      ctx.rect(-rxOuter * 1.5, -ryOuter * 1.5, rxOuter * 3, ryOuter * 1.5);
    } else {
      // Bottom/front half
      ctx.rect(-rxOuter * 1.5, 0, rxOuter * 3, ryOuter * 1.5);
    }
    ctx.clip();

    // Outer ring body
    ctx.beginPath();
    ctx.ellipse(0, 0, rxOuter, ryOuter, 0, 0, Math.PI * 2);
    ctx.ellipse(0, 0, rxInner, ryInner, 0, 0, Math.PI * 2, true);
    
    // Ring gradient & divisions
    const ringGrad = ctx.createRadialGradient(0, 0, rxInner, 0, 0, rxOuter);
    ringGrad.addColorStop(0.0, ringInfo.color1);
    ringGrad.addColorStop(0.45, ringInfo.color2);
    ringGrad.addColorStop(0.5, 'rgba(0,0,0,0.85)'); // Cassini Division!
    ringGrad.addColorStop(0.55, ringInfo.color1);
    ringGrad.addColorStop(0.9, ringInfo.color2);
    ringGrad.addColorStop(1.0, 'transparent');

    ctx.fillStyle = ringGrad;
    ctx.fill();

    // Planet shadow on rings (when ring is behind or around planet)
    if (isBackHalf) {
      ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
      ctx.beginPath();
      ctx.ellipse(0, 0, planetRadius * 1.2, ryOuter, 0, 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.restore();
  }

  // Render Planet with realistic light/dark terminator facing the central Sun
  function renderPlanet(planet, proj) {
    const r = planet.radius * proj.scale;

    ctx.save();

    // Orbit trail hint
    ctx.beginPath();
    ctx.arc(proj.x, proj.y, r, 0, Math.PI * 2);
    ctx.clip();

    // Base body color
    ctx.fillStyle = planet.color;
    ctx.fillRect(proj.x - r, proj.y - r, r * 2, r * 2);

    // Planetary Bands (Venus, Jupiter, Saturn, Neptune)
    if (planet.features && planet.features.bands && planet.features.bandColors) {
      const colors = planet.features.bandColors;
      const bandHeight = (r * 2) / colors.length;
      for (let b = 0; b < colors.length; b++) {
        ctx.fillStyle = colors[b];
        ctx.fillRect(proj.x - r, proj.y - r + b * bandHeight, r * 2, bandHeight + 0.5);
      }
    }

    // Jupiter Great Red Spot
    if (planet.features && planet.features.greatRedSpot) {
      ctx.fillStyle = '#b83b1d';
      ctx.beginPath();
      const spotAngle = globalTime * 0.02;
      const spotX = proj.x + Math.cos(spotAngle) * (r * 0.45);
      const spotY = proj.y + r * 0.25;
      ctx.ellipse(spotX, spotY, r * 0.24, r * 0.14, 0.1, 0, Math.PI * 2);
      ctx.fill();
    }

    // Mars Polar Ice Cap
    if (planet.features && planet.features.polarCap) {
      ctx.fillStyle = '#e8f4f8';
      ctx.beginPath();
      ctx.ellipse(proj.x, proj.y - r * 0.78, r * 0.42, r * 0.18, 0, 0, Math.PI * 2);
      ctx.fill();
    }

    // Earth Continents / Clouds simulation
    if (planet.clouds) {
      // Continents (greenish cyan patches)
      ctx.fillStyle = 'rgba(60, 140, 70, 0.75)';
      ctx.beginPath();
      const continentOffset = (globalTime * 0.015) % (Math.PI * 2);
      ctx.ellipse(proj.x + Math.sin(continentOffset) * (r * 0.4), proj.y - r * 0.1, r * 0.35, r * 0.45, 0.2, 0, Math.PI * 2);
      ctx.ellipse(proj.x - Math.sin(continentOffset + 1.8) * (r * 0.5), proj.y + r * 0.15, r * 0.3, r * 0.35, -0.3, 0, Math.PI * 2);
      ctx.fill();

      // Atmospheric cloud swirls
      ctx.fillStyle = 'rgba(255, 255, 255, 0.55)';
      ctx.beginPath();
      const cloudOffset = (globalTime * 0.02) % (Math.PI * 2);
      ctx.arc(proj.x + Math.cos(cloudOffset) * (r * 0.3), proj.y - r * 0.2, r * 0.25, 0, Math.PI * 2);
      ctx.arc(proj.x - Math.cos(cloudOffset) * (r * 0.4), proj.y + r * 0.2, r * 0.35, 0, Math.PI * 2);
      ctx.fill();
    }

    // Dynamic 3D Spherical Lighting
    // The light source is the Sun at (0, 0, 0), projected screen center is approx (width/2, height/2)
    const sunProj = project(0, 0, 0);
    const sunDx = sunProj.x - proj.x;
    const sunDy = sunProj.y - proj.y;
    const distToSun = Math.hypot(sunDx, sunDy) || 1;
    const lightDirX = sunDx / distToSun;
    const lightDirY = sunDy / distToSun;

    // Day/Night Terminator Shadow Gradient
    const lightOffsetX = proj.x + lightDirX * (r * 0.35);
    const lightOffsetY = proj.y + lightDirY * (r * 0.35);

    const shadeGrad = ctx.createRadialGradient(
      lightOffsetX, lightOffsetY, r * 0.2,
      proj.x - lightDirX * (r * 0.4), proj.y - lightDirY * (r * 0.4), r * 1.3
    );
    shadeGrad.addColorStop(0, 'rgba(255, 255, 255, 0.22)');
    shadeGrad.addColorStop(0.45, 'rgba(0, 0, 0, 0.0)');
    shadeGrad.addColorStop(0.75, 'rgba(0, 0, 0, 0.7)');
    shadeGrad.addColorStop(1, 'rgba(0, 0, 0, 0.96)');

    ctx.fillStyle = shadeGrad;
    ctx.fillRect(proj.x - r, proj.y - r, r * 2, r * 2);

    ctx.restore();

    // Atmospheric Edge Glow on illuminated rim
    if (planet.atmosphere) {
      ctx.save();
      ctx.strokeStyle = planet.atmosphere;
      ctx.lineWidth = Math.max(1, 1.8 * proj.scale);
      ctx.beginPath();
      ctx.arc(proj.x, proj.y, r + 0.5, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    }
  }

  // Render Moon with its own orbit & shadow
  function renderMoon(moon, parentPlanet, parentProj) {
    const mAngle = moon.angle;
    const mx = Math.cos(mAngle) * moon.distance;
    const mz = Math.sin(mAngle) * moon.distance;
    // Slight moon orbital tilt
    const my = Math.sin(mAngle) * 4;

    // Moon's world coordinates
    const pWorldX = parentPlanet.distance * Math.cos(parentPlanet.angle) + mx;
    const pWorldY = my;
    const pWorldZ = parentPlanet.distance * Math.sin(parentPlanet.angle) + mz;

    const mProj = project(pWorldX, pWorldY, pWorldZ);
    const mr = Math.max(0.9, moon.radius * mProj.scale);

    // Orbit ring around parent planet
    ctx.beginPath();
    const moonSegments = 32;
    for (let i = 0; i <= moonSegments; i++) {
      const th = (i / moonSegments) * Math.PI * 2;
      const tX = parentPlanet.distance * Math.cos(parentPlanet.angle) + Math.cos(th) * moon.distance;
      const tZ = parentPlanet.distance * Math.sin(parentPlanet.angle) + Math.sin(th) * moon.distance;
      const op = project(tX, 0, tZ);
      if (i === 0) ctx.moveTo(op.x, op.y);
      else ctx.lineTo(op.x, op.y);
    }
    ctx.strokeStyle = 'rgba(180, 210, 255, 0.05)';
    ctx.lineWidth = 0.8;
    ctx.stroke();

    // Render Moon Sphere
    ctx.save();
    ctx.fillStyle = moon.color;
    ctx.beginPath();
    ctx.arc(mProj.x, mProj.y, mr, 0, Math.PI * 2);
    ctx.fill();

    // Moon shadow
    const sunProj = project(0, 0, 0);
    const sunDx = sunProj.x - mProj.x;
    const sunDy = sunProj.y - mProj.y;
    const dist = Math.hypot(sunDx, sunDy) || 1;
    const lX = sunDx / dist;
    const lY = sunDy / dist;

    const mg = ctx.createRadialGradient(
      mProj.x + lX * (mr * 0.3), mProj.y + lY * (mr * 0.3), mr * 0.1,
      mProj.x - lX * (mr * 0.3), mProj.y - lY * (mr * 0.3), mr
    );
    mg.addColorStop(0, 'rgba(255,255,255,0.2)');
    mg.addColorStop(0.5, 'transparent');
    mg.addColorStop(1, 'rgba(0,0,0,0.85)');
    ctx.fillStyle = mg;
    ctx.beginPath();
    ctx.arc(mProj.x, mProj.y, mr, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    return {
      name: moon.name,
      proj: mProj
    };
  }

  // Telemetry HUD updater
  const telemetryEl = document.getElementById('telemetry');
  let frameCount = 0;
  function updateTelemetry(sunProj) {
    frameCount++;
    if (frameCount % 12 === 0) {
      const pDeg = (camera.pitch * 180 / Math.PI).toFixed(1);
      const earth = planets[2];
      const earthAngleDeg = ((earth.angle * 180 / Math.PI) % 360).toFixed(0);
      telemetryEl.innerHTML = `SYSTEM: SOL // CAM TILT: ${pDeg}&deg;<br>` +
        `EARTH HELIO-POS: ${earthAngleDeg}&deg; // SIM SPEED: 1.0x<br>` +
        `ACTIVE BODIES: 8 PLANETS // 14 MOONS // DEEP FIELD`;
    }
  }

  // Main Animation Loop
  function animate() {
    requestAnimationFrame(animate);

    globalTime++;

    // Smooth camera inertia zoom
    camera.distance += (camera.targetDistance - camera.distance) * 0.06;

    // Automatic slow cinematic orbit drift when user is not dragging
    if (!camera.isDragging) {
      camera.yaw += camera.autoRotateSpeed;
      // Gentle sinusoidal breathing tilt
      camera.pitch = (58.5 + Math.sin(globalTime * 0.003) * 2.5) * Math.PI / 180;
    }

    // Clear and draw deep cosmic backdrop
    ctx.clearRect(0, 0, width, height);
    renderBackground();

    // 1. Render all faint orbit guide ellipses first
    for (const planet of planets) {
      renderOrbitPath(planet.distance);
    }

    // 2. Calculate positions and prepare renderable entities for Depth Sorting (Z-buffer)
    const sunProj = project(0, 0, 0);

    const renderList = [];

    // Add Sun to render list
    renderList.push({
      type: 'sun',
      rawZ: sunProj.rawZ,
      proj: sunProj
    });

    // Update and add planets to render list
    for (const planet of planets) {
      planet.angle += planet.speed;

      const wx = planet.distance * Math.cos(planet.angle);
      const wz = planet.distance * Math.sin(planet.angle);
      const wy = 0;

      const proj = project(wx, wy, wz);

      // If planet has rings, split ring rendering into back and front halves
      if (planet.rings) {
        // Back half of rings (rendered behind the planet)
        renderList.push({
          type: 'rings',
          rawZ: proj.rawZ - 0.1, // slightly behind
          planet: planet,
          proj: proj,
          isBackHalf: true
        });
      }

      // Planet body
      renderList.push({
        type: 'planet',
        rawZ: proj.rawZ,
        planet: planet,
        proj: proj
      });

      // Front half of rings (rendered in front of the planet)
      if (planet.rings) {
        renderList.push({
          type: 'rings',
          rawZ: proj.rawZ + 0.1, // slightly in front
          planet: planet,
          proj: proj,
          isBackHalf: false
        });
      }

      // Update and add planet's moons
      for (const moon of planet.moons) {
        moon.angle += moon.speed;
        const mx = Math.cos(moon.angle) * moon.distance;
        const mz = Math.sin(moon.angle) * moon.distance;
        const mProj = project(wx + mx, 0, wz + mz);

        renderList.push({
          type: 'moon',
          rawZ: mProj.rawZ,
          moon: moon,
          planet: planet,
          parentProj: proj
        });
      }
    }

    // 3. Sort entities by depth (back to front: highest Z to lowest Z in camera coordinates)
    // In our camera space, larger rawZ is further away from camera
    renderList.sort((a, b) => b.rawZ - a.rawZ);

    // 4. Render all entities in correct occlusion order
    for (const item of renderList) {
      if (item.type === 'sun') {
        renderSun(item.proj);
      } else if (item.type === 'planet') {
        renderPlanet(item.planet, item.proj);
      } else if (item.type === 'rings') {
        renderPlanetRings(item.planet.rings, item.proj, item.planet.radius * item.proj.scale, item.isBackHalf);
      } else if (item.type === 'moon') {
        renderMoon(item.moon, item.planet, item.parentProj);
      }
    }

    updateTelemetry(sunProj);
  }

  // Start the continuous cinematic journey
  animate();

})();
</script>
</body>
