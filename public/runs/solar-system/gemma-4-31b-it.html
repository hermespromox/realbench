<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cinematic Solar System</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #050508;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
    </style>
</head>
<body>
    <canvas id="solarCanvas"></canvas>
    <script>
        const canvas = document.getElementById('solarCanvas');
        const ctx = canvas.getContext('2d');

        let width, height;
        let stars = [];
        let planets = [];
        let frame = 0;

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
            initStars();
        }

        function initStars() {
            stars = [];
            for (let i = 0; i < 400; i++) {
                stars.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    size: Math.random() * 1.5,
                    opacity: Math.random(),
                    drift: Math.random() * 0.05
                });
            }
        }

        const planetData = [
            { name: "Mercury", dist: 60, size: 3, speed: 0.047, color: "#A5A5A5", moons: 0 },
            { name: "Venus", dist: 90, size: 5, speed: 0.035, color: "#E3BB76", moons: 0 },
            { name: "Earth", dist: 130, size: 5.5, speed: 0.029, color: "#2271B3", moons: 1 },
            { name: "Mars", dist: 170, size: 4, speed: 0.024, color: "#E27B57", moons: 0 },
            { name: "Jupiter", dist: 240, size: 12, speed: 0.013, color: "#D39C7E", moons: 4 },
            { name: "Saturn", dist: 310, size: 10, speed: 0.009, color: "#C5AB6E", moons: 3, rings: true },
            { name: "Uranus", dist: 370, size: 7, speed: 0.006, color: "#BBE1E4", moons: 2 },
            { name: "Neptune", dist: 420, size: 7, speed: 0.005, color: "#6081FF", moons: 1 },
        ];

        function initPlanets() {
            planets = planetData.map(p => {
                const moons = [];
                for (let i = 0; i < p.moons; i++) {
                    moons.push({
                        dist: p.size + 5 + Math.random() * 10,
                        size: 1 + Math.random() * 1.5,
                        speed: 0.05 + Math.random() * 0.1,
                        angle: Math.random() * Math.PI * 2,
                        color: "#DDD"
                    });
                }
                return { ...p, angle: Math.random() * Math.PI * 2, moons };
            });
        }

        function drawSun() {
            const gradient = ctx.createRadialGradient(width/2, height/2, 0, width/2, height/2, 30);
            gradient.addColorStop(0, '#FFF5F2');
            gradient.addColorStop(0.2, '#FFD200');
            gradient.addColorStop(0.5, '#F7941E');
            gradient.addColorStop(1, 'transparent');
            
            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.arc(width/2, height/2, 30, 0, Math.PI * 2);
            ctx.fill();

            // Glow effect
            ctx.globalCompositeOperation = 'screen';
            ctx.beginPath();
            ctx.arc(width/2, height/2, 40 + Math.sin(frame * 0.05) * 2, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(255, 165, 0, 0.2)';
            ctx.fill();
            ctx.globalCompositeOperation = 'source-over';
        }

        function drawOrbit(dist) {
            ctx.beginPath();
            ctx.arc(width/2, height/2, dist, 0, Math.PI * 2);
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.08)';
            ctx.lineWidth = 1;
            ctx.stroke();
        }

        function drawPlanet(p) {
            const x = width/2 + Math.cos(p.angle) * p.dist;
            const y = height/2 + Math.sin(p.angle) * p.dist;

            // Orbit path
            drawOrbit(p.dist);

            // Planet body
            ctx.beginPath();
            ctx.arc(x, y, p.size, 0, Math.PI * 2);
            ctx.fillStyle = p.color;
            ctx.shadowBlur = 10;
            ctx.shadowColor = p.color;
            ctx.fill();
            ctx.shadowBlur = 0;

            // Saturn's rings
            if (p.rings) {
                ctx.beginPath();
                ctx.ellipse(x, y, p.size * 2.2, p.size * 0.8, p.angle + Math.PI/4, 0, Math.PI * 2);
                ctx.strokeStyle = 'rgba(197, 171, 110, 0.6)';
                ctx.lineWidth = 3;
                ctx.stroke();
            }

            // Moons
            p.moons.forEach(m => {
                m.angle += m.speed;
                const mx = x + Math.cos(m.angle) * m.dist;
                const my = y + Math.sin(m.angle) * m.dist;
                ctx.beginPath();
                ctx.arc(mx, my, m.size, 0, Math.PI * 2);
                ctx.fillStyle = m.color;
                ctx.fill();
            });
        }

        function animate() {
            ctx.clearRect(0, 0, width, height);
            frame++;

            // Background Stars
            ctx.fillStyle = '#FFF';
            stars.forEach(s => {
                s.x -= s.drift;
                if (s.x < 0) s.x = width;
                ctx.globalAlpha = s.opacity * (0.5 + Math.sin(frame * 0.02 + s.x) * 0.5);
                ctx.beginPath();
                ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.globalAlpha = 1.0;

            drawSun();

            planets.forEach(p => {
                p.angle += p.speed * 0.2; // Scale speed for cinematic feel
                drawPlanet(p);
            });

            requestAnimationFrame(animate);
        }

        window.addEventListener('resize', resize);
        resize();
        initPlanets();
        animate();
    </script>
</body>
</html>
