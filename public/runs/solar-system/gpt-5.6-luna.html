<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cinematic Solar System</title>
<style>
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #02050d;
  }
  canvas {
    display: block;
    width: 100vw;
    height: 100vh;
  }
</style>
</head>
<body>
<canvas id="space"></canvas>
<script>
(() => {
  const canvas = document.getElementById("space");
  const ctx = canvas.getContext("2d");
  let W = 0, H = 0, D = 1, S = 0, cx = 0, cy = 0;
  let start = performance.now();

  const TAU = Math.PI * 2;
  const stars = [];
  const rand = (n) => {
    const x = Math.sin(n * 127.31 + 19.17) * 43758.5453;
    return x - Math.floor(x);
  };

  for (let i = 0; i < 460; i++) {
    stars.push({
      x: rand(i + 2),
      y: rand(i + 83),
      z: 0.15 + rand(i + 221) * 0.85,
      size: 0.25 + rand(i + 412) * 1.45,
      phase: rand(i + 718) * TAU,
      hue: rand(i + 941)
    });
  }

  const planets = [
    { name:"MERCURY", color:"#aaa7a0", hi:"#eee4d2", radius:.010, orbit:.095, speed:1.35, tilt:.72, phase:.4, moons:0 },
    { name:"VENUS",   color:"#c98f57", hi:"#f4c682", radius:.016, orbit:.145, speed:.98, tilt:.69, phase:2.1, moons:0 },
    { name:"EARTH",   color:"#347ec3", hi:"#9bd6e8", radius:.018, orbit:.202, speed:.73, tilt:.74, phase:4.5, moons:1 },
    { name:"MARS",    color:"#a94535", hi:"#e18862", radius:.014, orbit:.258, speed:.59, tilt:.67, phase:1.7, moons:2 },
    { name:"JUPITER", color:"#c58d61", hi:"#f0d1a4", radius:.037, orbit:.337, speed:.35, tilt:.79, phase:5.2, moons:4 },
    { name:"SATURN",  color:"#c5a673", hi:"#f1d69e", radius:.032, orbit:.414, speed:.255, tilt:.73, phase:3.1, moons:3, ring:true },
    { name:"URANUS",  color:"#69b8c5", hi:"#b8f0e7", radius:.025, orbit:.492, speed:.18, tilt:.82, phase:.1, moons:2, ring:true },
    { name:"NEPTUNE", color:"#345eb6", hi:"#719ce8", radius:.024, orbit:.565, speed:.145, tilt:.77, phase:2.8, moons:1 }
  ];

  function resize() {
    D = Math.min(2, window.devicePixelRatio || 1);
    W = innerWidth; H = innerHeight;
    canvas.width = W * D;
    canvas.height = H * D;
    canvas.style.width = W + "px";
    canvas.style.height = H + "px";
    ctx.setTransform(D,0,0,D,0,0);
    cx = W / 2;
    cy = H / 2 + Math.min(25, H * .025);
    S = Math.min(W, H);
  }
  addEventListener("resize", resize);
  resize();

  function ellipsePoint(p, t) {
    const r = S * p.orbit;
    const x = Math.cos(t) * r;
    const y = Math.sin(t) * r * p.tilt;
    const z = Math.sin(t) * (1 - p.tilt);
    return { x: cx + x, y: cy + y + z * r * .09, z };
  }

  function drawBackground(t) {
    const bg = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.max(W,H)*.72);
    bg.addColorStop(0, "#111c35");
    bg.addColorStop(.28, "#080f22");
    bg.addColorStop(.7, "#030816");
    bg.addColorStop(1, "#01030a");
    ctx.fillStyle = bg;
    ctx.fillRect(0,0,W,H);

    const haze = ctx.createRadialGradient(cx, cy, 0, cx, cy, S*.52);
    haze.addColorStop(0, "rgba(55,74,130,.09)");
    haze.addColorStop(.55, "rgba(25,42,89,.035)");
    haze.addColorStop(1, "rgba(0,0,0,0)");
    ctx.fillStyle = haze;
    ctx.fillRect(0,0,W,H);

    for (const s of stars) {
      const driftX = ((s.x + t * .000004 * (1.2 - s.z)) % 1 + 1) % 1;
      const driftY = ((s.y + t * .0000017 * s.z) % 1 + 1) % 1;
      const x = driftX * W;
      const y = driftY * H;
      const pulse = .45 + .55 * Math.sin(t*.0012 + s.phase);
      const alpha = (.2 + .7*s.z) * pulse;
      let col = s.hue > .82 ? "185,215,255" : s.hue > .62 ? "255,233,184" : "205,218,255";
      ctx.fillStyle = `rgba(${col},${alpha})`;
      ctx.beginPath();
      ctx.arc(x, y, s.size * (.55 + s.z), 0, TAU);
      ctx.fill();
      if (s.z > .83 && s.size > 1.05) {
        ctx.strokeStyle = `rgba(${col},${alpha*.32})`;
        ctx.lineWidth = .5;
        ctx.beginPath();
        ctx.moveTo(x-4,y); ctx.lineTo(x+4,y);
        ctx.moveTo(x,y-4); ctx.lineTo(x,y+4);
        ctx.stroke();
      }
    }
  }

  function drawOrbit(p) {
    ctx.beginPath();
    for (let i=0; i<=150; i++) {
      const q = ellipsePoint(p, i/150*TAU);
      if (!i) ctx.moveTo(q.x,q.y); else ctx.lineTo(q.x,q.y);
    }
    ctx.strokeStyle = "rgba(128,159,219,.105)";
    ctx.lineWidth = 1;
    ctx.stroke();
    ctx.beginPath();
    for (let i=0; i<=44; i++) {
      const q = ellipsePoint(p, i/44*TAU);
      if (!i) ctx.moveTo(q.x,q.y); else ctx.lineTo(q.x,q.y);
    }
    ctx.strokeStyle = "rgba(151,181,240,.035)";
    ctx.lineWidth = 3;
    ctx.stroke();
  }

  function sphere(x,y,r,base,highlight,phase=0) {
    ctx.save();
    ctx.shadowColor = base;
    ctx.shadowBlur = r * .7;
    const g = ctx.createRadialGradient(x-r*.36,y-r*.45,r*.08,x+r*.15,y+r*.2,r*1.1);
    g.addColorStop(0, highlight);
    g.addColorStop(.34, base);
    g.addColorStop(1, "#080d19");
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(x,y,r,0,TAU); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.globalAlpha = .18;
    ctx.fillStyle = "#ffffff";
    for (let i=0;i<4;i++) {
      const a = phase + i*2.4;
      ctx.beginPath();
      ctx.ellipse(x+Math.cos(a)*r*.28,y+Math.sin(a)*r*.34,r*.18,r*.035,a,0,TAU);
      ctx.fill();
    }
    ctx.restore();
  }

  function drawRings(x,y,r,planet,front=false) {
    ctx.save();
    ctx.translate(x,y);
    ctx.rotate(planet.name === "URANUS" ? -.38 : -.16);
    ctx.scale(1,.35);
    ctx.strokeStyle = front ? "rgba(238,215,165,.5)" : "rgba(205,184,140,.55)";
    ctx.lineWidth = r*.16;
    ctx.beginPath(); ctx.ellipse(0,0,r*1.72,r*.8,0,0,TAU); ctx.stroke();
    ctx.strokeStyle = "rgba(92,77,62,.55)";
    ctx.lineWidth = r*.045;
    ctx.beginPath(); ctx.ellipse(0,0,r*1.3,r*.8,0,0,TAU); ctx.stroke();
    ctx.restore();
  }

  function drawMoon(x,y,r,index,t) {
    const a = t * (.001 + index*.00022) * (index%2 ? -1 : 1) + index*2.1;
    const dist = r * (2.1 + index*.75);
    const mx = x + Math.cos(a)*dist;
    const my = y + Math.sin(a)*dist*.54;
    const mr = Math.max(1.2, r*(.18 + index*.035));
    ctx.fillStyle = "rgba(183,199,218,.72)";
    ctx.shadowColor = "rgba(180,210,255,.5)";
    ctx.shadowBlur = 4;
    ctx.beginPath(); ctx.arc(mx,my,mr,0,TAU); ctx.fill();
    ctx.shadowBlur = 0;
  }

  function drawSun(t) {
    const r = S*.071;
    ctx.save();
    for (let i=4;i>=0;i--) {
      const rr = r*(1.25+i*.42);
      const glow = ctx.createRadialGradient(cx,cy,r*.4,cx,cy,rr);
      glow.addColorStop(0, `rgba(255,180,49,${.09/(i+1)})`);
      glow.addColorStop(1, "rgba(255,120,20,0)");
      ctx.fillStyle=glow; ctx.beginPath(); ctx.arc(cx,cy,rr,0,TAU); ctx.fill();
    }
    ctx.globalCompositeOperation = "lighter";
    for (let i=0;i<22;i++) {
      const a = i*TAU/22 + t*.00008;
      const len = r*(1.16 + .18*Math.sin(t*.001+i));
      ctx.strokeStyle = `rgba(255,185,65,${.13 + .07*Math.sin(i+t*.001)})`;
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(cx+Math.cos(a)*r*.94,cy+Math.sin(a)*r*.94);
      ctx.lineTo(cx+Math.cos(a)*len,cy+Math.sin(a)*len);
      ctx.stroke();
    }
    ctx.globalCompositeOperation = "source-over";
    const g=ctx.createRadialGradient(cx-r*.3,cy-r*.4,r*.05,cx,cy,r);
    g.addColorStop(0,"#fff9bf"); g.addColorStop(.3,"#ffd75c"); g.addColorStop(.72,"#ff9b25"); g.addColorStop(1,"#d94b0d");
    ctx.fillStyle=g; ctx.shadowColor="#ff9b28"; ctx.shadowBlur=r*.8;
    ctx.beginPath();ctx.arc(cx,cy,r,0,TAU);ctx.fill();
    ctx.shadowBlur=0;
    ctx.globalAlpha=.22; ctx.fillStyle="#fff5a2";
    for(let i=0;i<14;i++){let a=i*2.7;ctx.beginPath();ctx.arc(cx+Math.cos(a)*r*.45,cy+Math.sin(a)*r*.45,r*.07,0,TAU);ctx.fill();}
    ctx.restore();
  }

  function frame(now) {
    const t = now - start;
    drawBackground(t);
    planets.forEach(drawOrbit);
    drawSun(t);

    const placed = planets.map(p => {
      const q = ellipsePoint(p, p.phase + t*.000035*p.speed);
      return {p,q};
    }).sort((a,b)=>a.q.z-b.q.z);

    for (const item of placed) {
      const p=item.p, q=item.q;
      const depth = .88 + q.z*.18;
      const r=S*p.radius*depth;
      if (p.ring) drawRings(q.x,q.y,r,p,false);
      for(let m=0;m<p.moons;m++) drawMoon(q.x,q.y,r,m,t);
      sphere(q.x,q.y,r,p.color,p.hi,p.phase);
      if (p.ring) drawRings(q.x,q.y,r,p,true);

      ctx.font = `${Math.max(8, S*.010)}px system-ui, sans-serif`;
      ctx.letterSpacing = "1px";
      ctx.fillStyle = "rgba(181,201,237,.42)";
      ctx.textAlign = q.x > cx ? "left" : "right";
      const lx = q.x + (q.x > cx ? r+5 : -r-5);
      ctx.fillText(p.name, lx, q.y + 3);
    }

    ctx.fillStyle="rgba(203,219,255,.55)";
    ctx.font=`${Math.max(9,S*.011)}px system-ui,sans-serif`;
    ctx.textAlign="center";
    ctx.letterSpacing="3px";
    ctx.fillText("THE SOLAR SYSTEM",cx,Math.max(28,H*.065));
    ctx.fillStyle="rgba(155,178,220,.3)";
    ctx.font=`${Math.max(8,S*.008)}px system-ui,sans-serif`;
    ctx.letterSpacing="2px";
    ctx.fillText("A QUIET ORBITAL DANCE",cx,Math.max(44,H*.088));

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
