<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050818}
canvas{display:block;width:100vw;height:100vh;image-rendering:pixelated;image-rendering:crisp-edges}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(() => {
"use strict";

const canvas=document.getElementById("c");
const ctx=canvas.getContext("2d",{alpha:false});
ctx.imageSmoothingEnabled=false;

let W=384,H=216,G=184;
let camera=0,time=0,last=0,fade=0,ending=false;
const LEVEL=4620;
let platforms=[],pipes=[],blocks=[],coins=[],enemies=[],particles=[];
let mario;

const gaps=[
 [515,558],[1035,1082],[1638,1688],[2255,2300],
 [3338,3388],[4005,4050]
];

function groundAt(x){
  if(x<0||x>LEVEL) return false;
  for(const g of gaps) if(x>g[0]&&x<g[1]) return false;
  return true;
}

function addPlatform(x,y,w,kind="brick",moving=0){
  platforms.push({x,y,w,h:8,kind,baseY:y,moving,phase:x*.017});
}
function addPipe(x,height,warp=false,dest=false){
  pipes.push({x,y:G-height,w:30,h:height,warp,dest});
}
function addBlock(x,y,type="bright"){
  blocks.push({x,y,w:16,h:16,type,hit:false,bump:0,phase:x*.05});
}
function addCoin(x,y){
  coins.push({x,y,got:false,t:Math.random()*6.28});
}
function addEnemy(x,a,b,type="walker"){
  enemies.push({x,y:G-14,v:type==="shell"?-18:-14,a,b,type,dead:false,squash:0,phase:Math.random()*4});
}

function build(){
  G=H-32;
  platforms=[]; pipes=[]; blocks=[]; coins=[]; enemies=[]; particles=[];

  addPlatform(240,G-42,96);
  addBlock(278,G-70,"bright");
  addBlock(310,G-70,"brick");
  addBlock(326,G-70,"bright");

  addPipe(425,26);
  addPlatform(608,G-30,74);
  addPlatform(710,G-48,82);
  addBlock(730,G-76,"bright");
  addBlock(746,G-76,"brick");
  addBlock(762,G-76,"bright");

  addPipe(900,38);
  addPlatform(1110,G-27,60);
  addPlatform(1180,G-54,100);
  addBlock(1206,G-82,"bright");
  addBlock(1222,G-82,"brick");
  addBlock(1238,G-82,"bright");

  addPipe(1362,30);
  addPlatform(1450,G-28,68);
  addPlatform(1530,G-42,86);
  addBlock(1555,G-70,"bright");

  addPlatform(1710,G-30,94);
  addPlatform(1818,G-56,92);
  addBlock(1840,G-84,"bright");
  addBlock(1856,G-84,"brick");
  addBlock(1872,G-84,"bright");

  addPipe(2050,42);
  addPlatform(2130,G-30,88);
  addPlatform(2332,G-34,74);
  addPlatform(2422,G-58,110);
  addBlock(2460,G-86,"bright");
  addBlock(2476,G-86,"bright");

  addPlatform(2570,G-29,82);
  addPipe(2695,36,true);
  addPipe(2820,58,false,true);
  addPlatform(2850,G-42,124);
  addPlatform(3000,G-66,96);
  addBlock(3026,G-94,"bright");
  addBlock(3042,G-94,"brick");

  addPlatform(3150,G-34,112);
  addPipe(3270,30);
  addPlatform(3410,G-32,76);
  addPlatform(3510,G-58,120);
  addBlock(3542,G-86,"bright");
  addBlock(3574,G-86,"bright");

  addPipe(3740,44);
  addPlatform(3820,G-30,98);
  addPlatform(4075,G-32,82);
  addPlatform(4190,G-54,112);
  addBlock(4220,G-82,"bright");
  addBlock(4236,G-82,"brick");
  addBlock(4252,G-82,"bright");
  addPlatform(4370,G-30,88);

  addPlatform(1950,G-72,52,"steel",5);
  addPlatform(3650,G-76,54,"steel",7);

  const coinSets=[
    [150,G-28],[180,G-38],[210,G-28],
    [275,G-90],[323,G-91],
    [475,G-45],[500,G-56],[535,G-66],[570,G-55],
    [625,G-52],[650,G-60],
    [720,G-66],[750,G-94],[780,G-66],
    [970,G-38],[1000,G-50],[1060,G-58],[1090,G-48],
    [1140,G-49],[1200,G-72],[1240,G-102],
    [1410,G-43],[1475,G-50],[1570,G-62],[1610,G-55],[1663,G-65],
    [1740,G-51],[1790,G-57],[1848,G-104],[1880,G-104],
    [1980,G-98],[2070,G-65],[2160,G-54],[2280,G-63],
    [2370,G-55],[2455,G-78],[2490,G-78],[2600,G-50],
    [2720,G-60],[2870,G-78],[2910,G-76],[3034,G-114],
    [3110,G-56],[3190,G-55],[3360,G-68],[3440,G-53],
    [3530,G-78],[3570,G-106],[3610,G-78],[3675,G-102],
    [3770,G-67],[3860,G-52],[4025,G-65],[4100,G-54],
    [4228,G-102],[4270,G-74],[4400,G-50],[4470,G-42]
  ];
  coinSets.forEach(q=>addCoin(q[0],q[1]));

  addEnemy(345,325,400);
  addEnemy(655,605,690);
  addEnemy(820,800,875,"shell");
  addEnemy(970,930,1025);
  addEnemy(1288,1280,1345);
  addEnemy(1490,1440,1525,"shell");
  addEnemy(1770,1700,1810);
  addEnemy(2150,2110,2235);
  addEnemy(2390,2320,2440);
  addEnemy(2590,2550,2670,"shell");
  addEnemy(3120,3070,3250);
  addEnemy(3450,3400,3500);
  addEnemy(3710,3650,3730);
  addEnemy(3890,3800,3990,"shell");
  addEnemy(4140,4060,4180);
  addEnemy(4430,4380,4510);

  mario={
    x:42,y:G-16,prevY:G-16,vx:0,vy:0,w:12,h:16,
    grounded:true,run:0,jumpLock:0,support:null,
    warp:"",warpTimer:0,warpDone:false,inv:0
  };
  camera=0; fade=1; ending=false;
}

function resize(){
  const dpr=Math.min(devicePixelRatio||1,2);
  H=240;
  W=Math.max(320,Math.round(H*innerWidth/innerHeight));
  canvas.width=Math.round(W*dpr);
  canvas.height=Math.round(H*dpr);
  canvas.style.width=innerWidth+"px";
  canvas.style.height=innerHeight+"px";
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.imageSmoothingEnabled=false;
  build();
}
addEventListener("resize",resize);

function rectsOverlap(a,b){
  return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
}
function jump(power=166){
  if(mario.grounded&&mario.jumpLock<=0){
    mario.vy=-power;
    mario.grounded=false;
    mario.support=null;
    mario.jumpLock=.18;
  }
}
function spark(x,y,color,count=5){
  for(let i=0;i<count;i++) particles.push({
    x,y,vx:(Math.random()-.5)*55,vy:-25-Math.random()*55,
    life:.45+Math.random()*.35,color,size:1+Math.random()*2
  });
}

function update(dt){
  time+=dt;
  fade=Math.max(0,fade-dt*1.8);

  for(const p of platforms) if(p.moving)
    p.y=p.baseY+Math.round(Math.sin(time*1.8+p.phase)*p.moving);

  for(const b of blocks){
    b.bump=Math.max(0,b.bump-dt*5);
  }

  for(const c of coins) c.t+=dt*7;

  for(const e of enemies){
    if(e.dead){ e.squash+=dt; continue; }
    e.phase+=dt*8;
    e.x+=e.v*dt;
    if(e.x<e.a){e.x=e.a;e.v=Math.abs(e.v);}
    if(e.x>e.b){e.x=e.b;e.v=-Math.abs(e.v);}
  }

  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];
    p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=170*dt;
    if(p.life<=0) particles.splice(i,1);
  }

  if(ending){
    fade=Math.min(1,fade+dt*.75);
    if(fade>=1) build();
    return;
  }

  if(mario.warp){
    mario.warpTimer+=dt;
    if(mario.warp==="enter"){
      const p=pipes.find(q=>q.warp);
      mario.x=p.x+9;
      mario.y=p.y-16+Math.min(24,mario.warpTimer*34);
      if(mario.warpTimer>.8){
        mario.warp="emerge";mario.warpTimer=0;
        const d=pipes.find(q=>q.dest);
        mario.x=d.x+9;mario.y=d.y+8;
        camera=Math.max(camera,mario.x-W*.34);
      }
    }else{
      const d=pipes.find(q=>q.dest);
      mario.x=d.x+9;
      mario.y=d.y+8-Math.min(24,mario.warpTimer*34);
      if(mario.warpTimer>.78){
        mario.warp="";mario.warpTimer=0;mario.warpDone=true;
        mario.y=d.y-16;mario.vx=45;mario.grounded=true;mario.support=d;
      }
    }
    camera+=(Math.max(0,mario.x-W*.34)-camera)*Math.min(1,dt*3);
    return;
  }

  mario.jumpLock-=dt;
  mario.inv=Math.max(0,mario.inv-dt);
  mario.prevY=mario.y;

  const targetSpeed=55;
  mario.vx+=(targetSpeed-mario.vx)*Math.min(1,dt*5.5);

  if(mario.grounded){
    let hazard=false;
    const look=mario.x+42;
    if(!groundAt(look)&&groundAt(mario.x+8)) hazard=true;

    for(const p of pipes){
      const d=p.x-(mario.x+mario.w);
      if(d>-3&&d<46&&p.y<G-8) hazard=true;
    }
    for(const e of enemies){
      if(!e.dead){
        const d=e.x-(mario.x+mario.w);
        if(d>-3&&d<48&&Math.abs((e.y+14)-(mario.y+16))<22) hazard=true;
      }
    }
    for(const p of platforms){
      const d=p.x-(mario.x+mario.w);
      if(d>2&&d<28&&p.y<mario.y+12&&p.y>mario.y-38) hazard=true;
    }
    for(const c of coins){
      if(!c.got){
        const d=c.x-mario.x;
        if(d>5&&d<28&&c.y<mario.y-12&&c.y>mario.y-58) hazard=true;
      }
    }
    for(const b of blocks){
      const d=b.x-mario.x;
      if(!b.hit&&d>-5&&d<16&&b.y+b.h<mario.y+3&&b.y+b.h>mario.y-34) hazard=true;
    }
    if(hazard) jump();
  }

  mario.vy+=330*dt;
  mario.vy=Math.min(230,mario.vy);
  mario.x+=mario.vx*dt;
  mario.y+=mario.vy*dt;
  mario.grounded=false;
  mario.support=null;

  const solids=[];
  if(groundAt(mario.x+6)) solids.push({x:-100,y:G,w:LEVEL+200,h:80,ground:true});
  for(const p of platforms) solids.push(p);
  for(const p of pipes) solids.push(p);
  for(const b of blocks) solids.push(b);

  if(mario.vy>=0){
    let best=null;
    const oldBottom=mario.prevY+mario.h;
    const newBottom=mario.y+mario.h;
    for(const s of solids){
      if(mario.x+mario.w>s.x+1&&mario.x<s.x+s.w-1 &&
         oldBottom<=s.y+3&&newBottom>=s.y&&newBottom<=s.y+18){
        if(!best||s.y<best.y) best=s;
      }
    }
    if(best){
      mario.y=best.y-mario.h;mario.vy=0;mario.grounded=true;mario.support=best;
      if(best.warp&&!mario.warpDone&&mario.x>best.x-4&&mario.x<best.x+best.w-4){
        mario.warp="enter";mario.warpTimer=0;
      }
    }
  }else{
    for(const b of blocks){
      const by=b.y+(b.bump>0?-2:0);
      if(mario.x+mario.w>b.x+2&&mario.x<b.x+b.w-2 &&
         mario.prevY>=by+b.h-3&&mario.y<=by+b.h){
        mario.y=by+b.h;mario.vy=30;
        if(!b.hit){
          b.hit=true;b.bump=1;
          spark(b.x+8,b.y-4,"#ffd34e",7);
          coins.push({x:b.x+5,y:b.y-14,got:false,t:0,rise:.6});
        }else b.bump=.45;
      }
    }
  }

  for(const p of pipes){
    if(rectsOverlap(mario,p)&&mario.y+mario.h>p.y+4){
      if(mario.prevY+mario.h>p.y+3){
        if(mario.x+mario.w/2<p.x+p.w/2) mario.x=p.x-mario.w;
        else mario.x=p.x+p.w;
        mario.vx*=.2;
      }
    }
  }

  for(const c of coins){
    if(c.got) continue;
    if(c.rise!==undefined){
      c.y-=42*dt;c.rise-=dt;
      if(c.rise<=0){c.got=true;continue;}
    }
    const cb={x:c.x-2,y:c.y-5,w:8,h:11};
    if(rectsOverlap(mario,cb)){
      c.got=true;spark(c.x+2,c.y,"#fff36a",6);
    }
  }

  for(const e of enemies){
    if(e.dead) continue;
    const eb={x:e.x,y:e.y,w:e.type==="shell"?14:13,h:14};
    if(rectsOverlap(mario,eb)){
      if(mario.vy>20&&mario.prevY+mario.h<=e.y+7){
        e.dead=true;e.squash=0;mario.vy=-112;mario.grounded=false;
        spark(e.x+7,e.y+4,"#e8c35c",5);
      }else if(mario.inv<=0){
        mario.inv=1.1;mario.vy=-105;mario.vx=-22;
      }
    }
  }

  if(mario.y>H+30){
    mario.x=Math.max(25,mario.x-95);
    mario.y=G-70;mario.vy=0;mario.vx=20;mario.inv=1;
  }

  mario.run+=dt*(Math.abs(mario.vx)*.12);
  const desired=Math.max(0,Math.min(LEVEL-W,camera+(mario.x-W*.34-camera)*dt*4.5));
  camera=desired;

  if(mario.x>LEVEL-80) ending=true;
}

function px(x,y,w,h,color){
  ctx.fillStyle=color;ctx.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h));
}

function cloud(x,y,s=1){
  x=Math.round(x);y=Math.round(y);
  px(x+6*s,y,22*s,7*s,"#fff");
  px(x+2*s,y+5*s,38*s,8*s,"#fff");
  px(x+11*s,y-5*s,10*s,9*s,"#fff");
  px(x+24*s,y-3*s,9*s,10*s,"#f7fbff");
  px(x+5*s,y+12*s,30*s,3*s,"#dcefff");
}

function hill(x,y,w,h,far=false){
  const c=far?"#63b76c":"#3f9f5e", hi=far?"#87cf82":"#63c66e";
  for(let yy=0;yy<h;yy+=4){
    const t=yy/h;
    const half=Math.floor((w*.1+w*.4*t)/4)*4;
    px(x+w/2-half,y+yy,half*2,4,c);
  }
  px(x+w*.4,y+h*.3,6,6,hi);
  px(x+w*.58,y+h*.52,8,5,hi);
  px(x+w*.48,y+h*.72,5,4,"#28794a");
}

function bush(x,y,w=42){
  const dark="#16764b",mid="#26965a",light="#43b966";
  px(x,y-8,w,12,dark);
  px(x+5,y-14,15,10,mid);px(x+17,y-19,18,15,mid);
  px(x+30,y-13,14,11,mid);
  px(x+10,y-13,8,5,light);px(x+23,y-17,8,5,light);
  px(x,y+2,w,4,"#075f3e");
}

function drawBackground(){
  const grad=ctx.createLinearGradient(0,0,0,H);
  grad.addColorStop(0,"#4b8fdc");
  grad.addColorStop(.72,"#70bdf0");
  grad.addColorStop(1,"#b8e3f4");
  ctx.fillStyle=grad;ctx.fillRect(0,0,W,H);

  const sunX=W-55-(camera*.012%70);
  px(sunX,24,20,20,"#ffe07b");
  px(sunX-3,29,26,10,"#ffe07b");
  px(sunX+5,21,10,26,"#ffe07b");

  for(let i=-1;i<12;i++){
    const x=i*160-(camera*.10%160);
    hill(x,96,112,70,true);
  }
  for(let i=-1;i<14;i++){
    const x=i*120-(camera*.20%120);
    hill(x,119,86,57,false);
  }

  for(let i=-2;i<16;i++){
    let x=i*128-(camera*.13%128);
    cloud(x,26+(i%3)*18,(i%4===0)?1.25:1);
  }

  for(let i=-2;i<20;i++){
    let x=i*92-(camera*.37%92);
    bush(x,G-5,36+(i%3)*8);
  }

  px(0,G-10,W,10,"#67c85b");
  px(0,G-6,W,6,"#3ba44f");
}

function drawGround(){
  const start=Math.floor(camera/16)*16-16;
  const end=camera+W+16;
  for(let x=start;x<end;x+=16){
    if(!groundAt(x+8)) continue;
    const sx=x-camera;
    px(sx,G,16,H-G,"#b76732");
    px(sx,G,16,4,"#59bd4d");
    px(sx,G+4,16,3,"#2e8a43");
    px(sx+2,G+10,5,4,"#d68b43");
    px(sx+10,G+18,6,3,"#8b4229");
    px(sx+1,G+27,8,3,"#e09a4c");
    px(sx+15,G+5,1,H-G-5,"#7d3826");
  }
}

function drawBrickTile(x,y,kind,hit=false){
  if(kind==="steel"){
    px(x,y,16,8,"#607486");px(x,y,16,2,"#b9d0d5");
    px(x+2,y+3,5,3,"#8199a4");px(x+10,y+3,4,3,"#3e5367");
    return;
  }
  if(kind==="bright"){
    const c=hit?"#8d754f":"#d98a27";
    px(x,y,16,16,c);
    px(x+2,y+2,12,12,hit?"#a28a61":"#f5b73c");
    px(x+4,y+4,3,3,hit?"#6c604a":"#ffe37a");
    px(x+10,y+4,2,5,hit?"#74664c":"#bd671f");
    px(x+7,y+10,4,2,hit?"#75674e":"#fff098");
    px(x,y,16,2,"#ffe071");px(x+14,y,2,16,"#7d451d");
  }else{
    px(x,y,16,16,"#a94f2d");
    px(x,y,16,2,"#ed8a45");px(x,y+7,16,2,"#71301f");
    px(x+7,y,2,8,"#71301f");px(x+3,y+8,2,8,"#71301f");
    px(x+10,y+8,2,8,"#71301f");
    px(x+1,y+2,5,4,"#cc6936");px(x+10,y+2,5,4,"#c76032");
  }
}

function drawWorld(){
  drawGround();

  for(const p of platforms){
    if(p.x+p.w<camera-20||p.x>camera+W+20) continue;
    for(let x=0;x<p.w;x+=16)
      drawBrickTile(p.x+x-camera,p.y,p.kind);
  }

  for(const b of blocks){
    if(b.x+b.w<camera||b.x>camera+W) continue;
    const oy=b.bump>0?-Math.sin(b.bump*Math.PI)*3:0;
    drawBrickTile(b.x-camera,b.y+oy,b.type,b.hit);
  }

  for(const p of pipes){
    if(p.x+p.w<camera||p.x>camera+W) continue;
    const x=p.x-camera;
    px(x+4,p.y,22,p.h,"#178f4b");
    px(x+8,p.y+5,6,p.h-5,"#5ad765");
    px(x+20,p.y+5,6,p.h-5,"#086d3e");
    px(x,p.y,30,8,"#08713f");
    px(x+2,p.y-4,26,8,"#1aa153");
    px(x+6,p.y-3,7,6,"#6bea70");
    px(x+23,p.y-3,4,6,"#075e38");
  }

  for(const c of coins){
    if(c.got||c.x<camera-10||c.x>camera+W+10) continue;
    const x=c.x-camera,y=c.y+Math.round(Math.sin(c.t)*2);
    const f=Math.abs(Math.sin(c.t));
    const w=f<.25?2:f<.65?5:8;
    px(x+(8-w)/2,y-5,w,11,"#df941c");
    if(w>4){
      px(x+(8-w)/2+1,y-4,w-2,9,"#ffd842");
      px(x+3,y-3,2,6,"#fff19a");
    }
  }

  for(const e of enemies){
    if(e.x<camera-20||e.x>camera+W+20||e.squash>.45) continue;
    drawEnemy(e);
  }

  if(camera>LEVEL-W-300) drawFortress();

  for(const p of particles){
    px(p.x-camera,p.y,p.size,p.size,p.color);
  }
}

function drawEnemy(e){
  const x=Math.round(e.x-camera), y=Math.round(e.y);
  if(e.dead){
    px(x,y+10,13,4,e.type==="shell"?"#258b43":"#8c482d");
    return;
  }
  const step=Math.sin(e.phase)>0?1:-1;
  if(e.type==="shell"){
    px(x+3,y,8,3,"#f5d47c");
    px(x+1,y+3,12,8,"#258b43");
    px(x+4,y+4,6,5,"#62bf4b");
    px(x+2,y+11,4,3,"#e6bd69");px(x+9,y+11,4,3,"#e6bd69");
    px(x+(step>0?0:10),y+12,4,2,"#5d3825");
    px(x+10,y+1,2,2,"#20232b");
  }else{
    px(x+3,y,7,2,"#673524");
    px(x+1,y+2,11,7,"#9b522d");
    px(x,y+6,13,5,"#a95c31");
    px(x+3,y+4,2,3,"#f1d6a2");px(x+8,y+4,2,3,"#f1d6a2");
    px(x+4,y+5,1,2,"#1b2023");px(x+8,y+5,1,2,"#1b2023");
    px(x+2+(step>0?0:2),y+11,4,3,"#492719");
    px(x+8+(step>0?1:-1),y+11,4,3,"#492719");
  }
}

function drawMario(){
  if(mario.inv>0&&Math.floor(time*18)%2===0) return;
  const x=Math.round(mario.x-camera),y=Math.round(mario.y);
  const airborne=!mario.grounded;
  const frame=Math.floor(mario.run)%3;

  px(x+3,y,7,2,"#d72f27");
  px(x+2,y+2,10,3,"#ed3c2e");
  px(x+5,y+3,6,5,"#f1b06c");
  px(x+10,y+4,2,2,"#2e241e");
  px(x+3,y+5,2,2,"#6b3425");
  px(x+5,y+7,7,2,"#cc7a45");

  px(x+2,y+8,8,5,"#db3229");
  px(x+4,y+9,6,6,"#2359aa");
  px(x+3,y+11,2,3,"#f2c65d");
  px(x+9,y+10,2,3,"#f2c65d");

  if(airborne){
    px(x+1,y+9,3,5,"#e43a2e");
    px(x+9,y+8,3,4,"#e43a2e");
    px(x+2,y+14,5,2,"#593124");
    px(x+8,y+12,4,3,"#593124");
  }else if(frame===0){
    px(x+3,y+14,4,2,"#533023");
    px(x+8,y+13,3,3,"#533023");
  }else if(frame===1){
    px(x+1,y+13,5,3,"#533023");
    px(x+8,y+14,4,2,"#533023");
  }else{
    px(x+3,y+13,3,3,"#533023");
    px(x+7,y+13,5,3,"#533023");
  }
}

function drawFortress(){
  const x=LEVEL-115-camera,y=G-82;
  px(x+12,y+18,76,64,"#6f6573");
  px(x+4,y+8,16,16,"#807684");
  px(x+31,y,18,24,"#817786");
  px(x+65,y+7,18,17,"#817786");
  px(x+4,y+6,6,5,"#514955");
  px(x+14,y+6,6,5,"#514955");
  px(x+31,y-2,6,6,"#514955");
  px(x+43,y-2,6,6,"#514955");
  px(x+65,y+5,6,6,"#514955");
  px(x+77,y+5,6,6,"#514955");
  for(let yy=27;yy<72;yy+=13)
    for(let xx=17;xx<82;xx+=16)
      px(x+xx+(yy%26?0:7),y+yy,8,6,"#403b49");
  px(x+42,y+52,18,30,"#171626");
  px(x+46,y+48,10,8,"#171626");
  px(x+47,y+55,3,12,"#b34a31");
}

function draw(){
  drawBackground();
  drawWorld();
  drawMario();

  if(fade>0){
    ctx.fillStyle=`rgba(4,5,15,${Math.min(1,fade)})`;
    ctx.fillRect(0,0,W,H);
    if(fade>.45){
      const size=10;
      ctx.fillStyle=`rgba(0,0,0,${(fade-.45)*.65})`;
      for(let y=0;y<H;y+=size) for(let x=0;x<W;x+=size)
        if(((x/size+y/size+Math.floor(time*12))%3)<1)
          ctx.fillRect(x,y,size,size);
    }
  }
}

function loop(ts){
  const dt=Math.min(.033,(ts-last)/1000||.016);
  last=ts;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}

resize();
requestAnimationFrame(loop);
})();
</script>
</body>
