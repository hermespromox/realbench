<!DOCTYPE html>
<html lang="en">
<head>

<style>
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#5C94FC;}
canvas{display:block;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges;}
</style>

<body>
<canvas id="c"></canvas>
<script>
(function(){
const VIEW_W=256,VIEW_H=240,TILE=16,MAP_H=15,MAP_W=192,WORLD_W=MAP_W*TILE;
const GRAVITY=0.28,MAX_FALL=5.2,RUN_SPEED=1.62;
const SKY='#5C94FC',SKY2='#78A8FC';

const screen=document.getElementById('c');
const sctx=screen.getContext('2d');
const view=document.createElement('canvas');
view.width=VIEW_W;view.height=VIEW_H;
const ctx=view.getContext('2d');

const map=[];
for(let y=0;y<MAP_H;y++){map[y]=new Uint8Array(MAP_W);}

const T_GROUND=1,T_BRICK=2,T_Q=3,T_USED=4,T_PL=5,T_PR=6,T_PTL=7,T_PTR=8,T_HARD=9;
function isSolid(id){return id>0;}
function setT(x,y,id){if(x>=0&&x<MAP_W&&y>=0&&y<MAP_H)map[y][x]=id;}
function getT(x,y){
  if(y<0)return 0;
  if(y>=MAP_H)return T_GROUND;
  x=((x%MAP_W)+MAP_W)%MAP_W;
  return map[y][x];
}

for(let x=0;x<MAP_W;x++){setT(x,13,T_GROUND);setT(x,14,T_GROUND);}
function gap(a,b){for(let x=a;x<b;x++){setT(x,13,0);setT(x,14,0);}}
function pipe(x,h){
  const top=13-h;
  setT(x,top,T_PTL);setT(x+1,top,T_PTR);
  for(let i=1;i<h;i++){setT(x,top+i,T_PL);setT(x+1,top+i,T_PR);}
}
function bricks(x,y,w){for(let i=0;i<w;i++)setT(x+i,y,T_BRICK);}
function qrow(x,y,w){for(let i=0;i<w;i++)setT(x+i,y,T_Q);}
function hard(x,y,w){for(let i=0;i<w;i++)setT(x+i,y,T_HARD);}
function stairs(x,baseY,n,dir){
  for(let i=0;i<n;i++){
    const tx=dir>0?x+i:x-i;
    for(let j=0;j<=i;j++)setT(tx,baseY-j,T_HARD);
  }
}

gap(24,28);gap(46,51);gap(72,77);gap(104,109);gap(138,144);gap(168,172);
pipe(32,2);pipe(58,3);pipe(88,2);pipe(126,4);pipe(156,3);pipe(182,2);
bricks(18,9,1);qrow(19,9,3);bricks(22,9,1);
bricks(40,9,4);qrow(42,9,1);
qrow(64,9,2);bricks(66,9,1);
hard(80,11,3);hard(83,10,2);hard(85,9,2);
bricks(96,8,5);qrow(98,8,1);
hard(112,11,2);bricks(116,9,3);qrow(117,9,1);
stairs(146,12,4,1);
bricks(152,8,4);
hard(174,11,4);qrow(175,9,2);bricks(177,9,1);
qrow(6,9,1);bricks(8,9,1);qrow(10,9,1);
bricks(188,9,3);

const coins=[];
function addCoin(tx,ty){coins.push({x:tx*TILE+4,y:ty*TILE+4,w:8,h:8,got:false,ph:Math.random()*Math.PI*2});}
[[16,7],[17,7],[18,7],[19,7],[20,7],[40,7],[41,7],[42,7],[43,7],
 [64,6],[65,6],[80,8],[81,7],[82,6],[83,7],[84,8],
 [96,6],[97,6],[98,6],[99,6],[100,6],
 [116,7],[117,6],[118,7],
 [133,10],[134,9],[135,8],[136,9],[137,10],
 [152,6],[153,6],[154,6],[155,6],
 [174,8],[175,7],[176,7],[177,8],
 [7,7],[9,7],[11,7],
 [188,7],[189,7],[190,7],
 [28,10],[29,9],[30,10],
 [50,10],[51,9],[52,10],
 [73,10],[74,9],[75,10]
].forEach(p=>addCoin(p[0],p[1]));

const enemies=[];
function addE(tx,ty,type,minX,maxX){
  enemies.push({x:tx*TILE,y:ty*TILE,w:type?12:12,h:type?16:12,vx:type?-0.35:-0.45,type:type||0,dead:0,minX:minX*TILE,maxX:maxX*TILE,frame:0});
}
addE(14,12,0,12,22);addE(36,12,0,34,44);addE(42,12,1,38,46);
addE(54,12,0,52,70);addE(68,12,1,60,71);addE(82,12,0,78,87);
addE(94,12,0,90,103);addE(100,12,1,92,103);addE(118,12,0,112,124);
addE(134,12,0,128,137);addE(160,12,0,158,167);addE(164,12,1,158,167);
addE(178,12,0,174,181);addE(20,12,1,16,23);

const bumps={};
const particles=[];
const pipeAnims=[];

const mario={
  x:8,y:13*TILE-16,vx:0,vy:0,w:12,h:16,
  onGround:false,frame:0,anim:0,jumping:false,
  facing:1,safe:0,pipeState:0,pipeT:0,pipeRef:null
};

let cameraX=0,cameraY=0,time=0,shake=0;
let acc=0,last=performance.now();

function wrapTileX(x){return ((x%MAP_W)+MAP_W)%MAP_W;}
function solidPix(px,py){
  return isSolid(getT(Math.floor(px/TILE),Math.floor(py/TILE)));
}
function rectHits(x,y,w,h){
  const x0=Math.floor(x/TILE),x1=Math.floor((x+w-0.001)/TILE);
  const y0=Math.floor(y/TILE),y1=Math.floor((y+h-0.001)/TILE);
  for(let ty=y0;ty<=y1;ty++)for(let tx=x0;tx<=x1;tx++)if(isSolid(getT(tx,ty)))return true;
  return false;
}
function worldEntX(ex){
  const base=Math.floor(mario.x/WORLD_W)*WORLD_W;
  let best=ex+base,bd=1e9;
  for(const c of [ex+base,ex+base-WORLD_W,ex+base+WORLD_W]){
    const d=Math.abs(c-mario.x);if(d<bd){bd=d;best=c;}
  }
  return best;
}

function hitBlock(tx,ty){
  tx=wrapTileX(tx);
  if(ty<0||ty>=MAP_H)return;
  const id=map[ty][tx];
  if(id!==T_Q&&id!==T_BRICK&&id!==T_USED&&id!==T_HARD)return;
  const key=tx+','+ty;
  bumps[key]={o:0,v:-1.8,t:0};
  if(id===T_Q){
    map[ty][tx]=T_USED;
    particles.push({kind:'coin',x:tx*TILE+4,y:ty*TILE-4,vy:-3.2,life:28,ph:0});
    for(let i=0;i<6;i++)particles.push({kind:'spark',x:tx*TILE+8,y:ty*TILE+4,vx:(Math.random()-0.5)*1.6,vy:-Math.random()*2-0.5,life:12+Math.random()*8});
  }else if(id===T_BRICK){
    for(let i=0;i<5;i++)particles.push({kind:'brick',x:tx*TILE+8,y:ty*TILE+8,vx:(Math.random()-0.5)*2.2,vy:-Math.random()*2.5-1,life:18+Math.random()*10});
  }
}

function measureGap(){
  const foot=mario.y+mario.h+2;
  const mid=mario.x+mario.w*0.5;
  let start=-1,end=-1;
  for(let dx=4;dx<=90;dx+=2){
    const s=solidPix(mid+dx,foot);
    if(!s&&start<0)start=dx;
    if(s&&start>=0){end=dx;break;}
  }
  if(start<0)return 0;
  if(end<0)return 90-start;
  return end-start;
}
function wallHeight(){
  let h=0;
  for(let up=0;up<80;up+=4){
    if(solidPix(mario.x+mario.w+5,mario.y+mario.h-4-up))h=up+4;
    else break;
  }
  return h;
}
function enemyAhead(){
  for(const e of enemies){
    if(e.dead)continue;
    const ex=worldEntX(e.x);
    const dx=ex-mario.x;
    if(dx>0&&dx<42&&Math.abs((e.y+e.h)-(mario.y+mario.h))<20)return dx;
  }
  return 0;
}
function qblockUnder(){
  const cx=mario.x+mario.w*0.5;
  for(let dy=20;dy<88;dy+=8){
    const tx=Math.floor(cx/TILE),ty=Math.floor((mario.y-dy)/TILE);
    const id=getT(tx,ty);
    if(id===T_Q){
      const bx=wrapTileX(tx)*TILE+8;
      let wx=bx+Math.floor(mario.x/WORLD_W)*WORLD_W;
      if(Math.abs(wx+WORLD_W-cx)<Math.abs(wx-cx))wx+=WORLD_W;
      if(Math.abs(wx-WORLD_W-cx)<Math.abs(wx-cx))wx-=WORLD_W;
      if(Math.abs(wx-cx)<7)return true;
    }
  }
  return false;
}

function aiJump(){
  if(!mario.onGround||mario.pipeState)return;
  const gap=measureGap();
  const wall=wallHeight();
  const en=enemyAhead();
  const qb=qblockUnder();
  let want=false,power=-6.55;
  if(gap>6&&gap<18){want=true;power=-6.4;}
  else if(gap>=18&&gap<40){want=true;power=-7.15;}
  else if(gap>=40){want=true;power=-8.05;}
  if(wall>=8&&wall<=48){want=true;power=Math.min(power,-6.2-wall*0.055);}
  if(en&&en<34){want=true;power=Math.min(power,-6.7);}
  if(qb){want=true;power=Math.min(power,-7.35);}
  if(want){
    mario.vy=power;
    mario.onGround=false;
    mario.jumping=true;
  }
}

const PIPES_ENTER=[{x:126,dir:'down',outX:152,outY:8*TILE-16}];
let entered=false;

function updatePipesMario(){
  if(mario.pipeState===1){
    mario.vx=0;mario.vy=0;
    mario.y+=0.7;
    mario.pipeT++;
    if(mario.pipeT>28){
      mario.x=PIPES_ENTER[0].outX*TILE+2;
      mario.y=8*TILE;
      mario.pipeState=2;
      mario.pipeT=0;
    }
    return true;
  }
  if(mario.pipeState===2){
    mario.vx=0;mario.vy=0;
    mario.y-=0.7;
    mario.pipeT++;
    if(mario.pipeT>24){
      mario.pipeState=0;
      mario.vx=RUN_SPEED;
      mario.onGround=false;
    }
    return true;
  }
  if(!entered&&mario.onGround){
    const px=126*TILE;
    const wx=worldEntX(px%WORLD_W);
    if(Math.abs((mario.x+6)- (Math.floor(mario.x/WORLD_W)*WORLD_W+px) )<10 && mario.x>1200){
      const local= ((mario.x%WORLD_W)+WORLD_W)%WORLD_W;
      if(local>126*TILE-8&&local<126*TILE+24&&mario.y>10*TILE){
        entered=true;
        mario.pipeState=1;
        mario.pipeT=0;
        mario.x=Math.floor(mario.x/WORLD_W)*WORLD_W+126*TILE+10;
        return true;
      }
    }
  }
  return false;
}

function update(){
  time++;
  if(shake>0)shake--;
  mario.safe=Math.max(0,mario.safe-1);

  for(const k of Object.keys(bumps)){
    const b=bumps[k];
    b.v+=0.35;b.o+=b.v;b.t++;
    if(b.o>0){b.o=0;delete bumps[k];}
  }
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];
    p.life--;
    if(p.kind==='coin'){p.vy+=0.18;p.y+=p.vy;p.ph+=0.4;}
    else {p.x+=p.vx||0;p.y+=p.vy||0;p.vy=(p.vy||0)+0.18;}
    if(p.life<=0)particles.splice(i,1);
  }

  if(!updatePipesMario()){
    if(mario.vx<RUN_SPEED)mario.vx=Math.min(RUN_SPEED,mario.vx+0.08);
    aiJump();
    mario.vy+=GRAVITY;
    if(mario.vy>MAX_FALL)mario.vy=MAX_FALL;

    mario.x+=mario.vx;
    if(rectHits(mario.x,mario.y+1,mario.w,mario.h-2)){
      let g=0;
      while(g<12&&rectHits(mario.x,mario.y+1,mario.w,mario.h-2)){mario.x-=0.5;g++;}
      if(mario.onGround){mario.vy=-7.4;mario.onGround=false;mario.jumping=true;}
    }

    mario.y+=mario.vy;
    mario.onGround=false;
    if(rectHits(mario.x+1,mario.y,mario.w-2,mario.h)){
      if(mario.vy>0){
        let g=0;
        while(g<16&&rectHits(mario.x+1,mario.y,mario.w-2,mario.h)){mario.y-=0.5;g++;}
        mario.vy=0;mario.onGround=true;mario.jumping=false;
      }else if(mario.vy<0){
        const tx=Math.floor((mario.x+mario.w*0.5)/TILE);
        const ty=Math.floor(mario.y/TILE);
        hitBlock(tx,ty);hitBlock(tx-1,ty);hitBlock(tx+1,ty);
        let g=0;
        while(g<16&&rectHits(mario.x+1,mario.y,mario.w-2,mario.h)){mario.y+=0.5;g++;}
        mario.vy=0.8;
      }
    }
  }

  if(mario.y>VIEW_H+40){
    mario.y=8*TILE;mario.vy=0;mario.x+=48;
  }

  if(mario.onGround)mario.anim++;
  mario.frame=(mario.anim/5)|0;

  const mx=mario.x+mario.w*0.5,my=mario.y+mario.h*0.5;
  for(const c of coins){
    if(c.got)continue;
    const cx=worldEntX(c.x)+4,cy=c.y+Math.sin(time*0.12+c.ph)*2+4;
    if(Math.abs(mx-cx)<10&&Math.abs(my-cy)<12){
      c.got=true;
      for(let i=0;i<5;i++)particles.push({kind:'spark',x:cx,y:cy,vx:(Math.random()-0.5)*1.4,vy:-Math.random()*1.8,life:10+Math.random()*8});
    }
  }

  for(const e of enemies){
    if(e.dead>0){
      e.dead++;
      if(e.dead>12)e.y+=2.2;
      continue;
    }
    e.x+=e.vx;
    if(e.x<e.minX){e.x=e.minX;e.vx=Math.abs(e.vx);}
    if(e.x>e.maxX){e.x=e.maxX;e.vx=-Math.abs(e.vx);}
    const next=e.x+e.vx*4+(e.vx>0?e.w:0);
    if(!solidPix(next,e.y+e.h+2))e.vx*=-1;
    if(solidPix(e.x+(e.vx>0?e.w+1:-1),e.y+e.h*0.5))e.vx*=-1;
    e.frame++;
    const ex=worldEntX(e.x),ey=e.y;
    if(mario.pipeState)continue;
    const overlap=mario.x+mario.w>ex+1&&mario.x<ex+e.w-1&&mario.y+mario.h>ey+2&&mario.y<ey+e.h;
    if(overlap){
      if(mario.vy>0.15&&mario.y+mario.h-ey<10){
        e.dead=1;mario.vy=-5.1;mario.jumping=true;mario.onGround=false;shake=4;
        for(let i=0;i<6;i++)particles.push({kind:'spark',x:ex+6,y:ey+6,vx:(Math.random()-0.5)*2,vy:-Math.random()*2,life:10});
      }else if(!mario.safe){
        mario.vy=-5.6;mario.jumping=true;mario.onGround=false;mario.safe=40;shake=3;
      }
    }
  }

  const target=mario.x-72;
  cameraX+=(target-cameraX)*0.14;
  if(cameraX<0&&mario.x<WORLD_W)cameraX=Math.max(0,cameraX);
}

function pfill(c,x,y,w,h){ctx.fillStyle=c;ctx.fillRect(x|0,y|0,w,h);}

function drawDome(x,baseY,r,col,col2){
  ctx.fillStyle=col;
  for(let i=0;i<=r;i++){
    const yy=r-i;
    const w=Math.floor(Math.sqrt(Math.max(0,r*r-yy*yy)));
    ctx.fillRect((x-w)|0,(baseY-r+i)|0,w*2||1,1);
  }
  if(col2){
    ctx.fillStyle=col2;
    const rr=r*0.35,ox=x-r*0.28,oy=baseY-r*0.55;
    for(let i=0;i<=rr;i++){
      const yy=rr-i;
      const w=Math.floor(Math.sqrt(Math.max(0,rr*rr-yy*yy)));
      ctx.fillRect((ox-w)|0,(oy-rr+i)|0,w*2||1,1);
    }
  }
}

function drawCloud(x,y,s){
  const c='#F4F4FC',e='#D0D8F8';
  drawDome(x,y+6*s,6*s,c);
  drawDome(x+10*s,y+4*s,8*s,c);
  drawDome(x+20*s,y+6*s,6*s,c);
  drawDome(x+10*s,y+7*s,5*s,c);
  pfill(e,x+4*s,y+2*s,3,1);
}

function drawBush(x,y,s){
  drawDome(x,y,5*s,'#28B028','#80E060');
  drawDome(x+9*s,y-1,7*s,'#28B028','#80E060');
  drawDome(x+18*s,y,5*s,'#28B028','#80E060');
}

function drawHill(x,baseY,r){
  drawDome(x,baseY,r,'#18A018','#70D050');
  ctx.fillStyle='#18A018';
  ctx.fillRect((x-r)|0,baseY|0,r*2,VIEW_H-baseY);
}

function bumpOff(tx,ty){
  const b=bumps[wrapTileX(tx)+','+ty];
  return b?b.o:0;
}

function drawGroundTile(x,y){
  pfill('#C84C0C',x,y,16,16);
  pfill('#F4A07A',x,y,16,1);
  pfill('#7A2808',x,y+15,16,1);
  pfill('#7A2808',x+15,y,1,16);
  pfill('#E87840',x+1,y+1,3,1);
  pfill('#682008',x+3,y+5,2,2);
  pfill('#682008',x+9,y+3,2,2);
  pfill('#682008',x+6,y+10,2,2);
  pfill('#682008',x+12,y+8,2,2);
  pfill('#E07038',x+1,y+12,2,1);
}

function drawBrick(x,y){
  pfill('#C84C0C',x,y,16,16);
  pfill('#F4A07A',x,y,15,1);
  pfill('#F4A07A',x,y,1,15);
  pfill('#5A1808',x,y+7,16,1);
  pfill('#5A1808',x,y+15,16,1);
  pfill('#5A1808',x+7,y,1,7);
  pfill('#5A1808',x+15,y,1,16);
  pfill('#5A1808',x+3,y+8,1,7);
  pfill('#5A1808',x+11,y+8,1,7);
}

function drawQ(x,y,used){
  if(used){
    pfill('#A05820',x,y,16,16);
    pfill('#D09050',x,y,16,1);
    pfill('#D09050',x,y,1,16);
    pfill('#582808',x+15,y,1,16);
    pfill('#582808',x,y+15,16,1);
    pfill('#704018',x+3,y+3,10,10);
    pfill('#C07830',x+5,y+5,6,6);
    pfill('#503010',x+6,y+6,4,4);
  }else{
    const flash=((time/10)|0)%4===0;
    pfill(flash?'#F8D830':'#E8A818',x,y,16,16);
    pfill('#F8F0A0',x,y,15,1);
    pfill('#F8F0A0',x,y,1,15);
    pfill('#A06010',x+15,y,1,16);
    pfill('#A06010',x,y+15,16,1);
    pfill('#C07810',x+3,y+3,10,10);
    pfill('#F8E060',x+4,y+4,8,8);
    pfill('#A05008',x+6,y+6,4,2);
    pfill('#A05008',x+7,y+8,2,3);
    pfill('#F8F0C8',x+7,y+12,2,2);
  }
}

function drawHard(x,y){
  pfill('#C84C0C',x,y,16,16);
  pfill('#E89060',x,y,16,2);
  pfill('#E89060',x,y,2,16);
  pfill('#6A2008',x+14,y,2,16);
  pfill('#6A2008',x,y+14,16,2);
  pfill('#A04018',x+4,y+4,8,8);
}

function drawPipeTile(x,y,kind){
  const lip=kind===T_PTL||kind===T_PTR;
  const left=kind===T_PTL||kind===T_PL;
  if(lip){
    pfill('#24B024',x-1,y,18,4);
    pfill('#E0FFA0',x-1,y,18,1);
    pfill('#0C6810',x-1,y+3,18,1);
    if(left){
      pfill('#188818',x,y+4,15,12);
      pfill('#B8F070',x,y+4,2,12);
      pfill('#0A5010',x+13,y+4,3,12);
      pfill('#046004',x+4,y+4,3,12);
    }else{
      pfill('#188818',x+1,y+4,15,12);
      pfill('#0A5010',x,y+4,3,12);
      pfill('#B8F070',x+13,y+4,2,12);
    }
  }else{
    if(left){
      pfill('#188818',x,y,15,16);
      pfill('#B8F070',x,y,2,16);
      pfill('#0A5010',x+13,y,3,16);
      pfill('#046004',x+4,y,3,16);
    }else{
      pfill('#188818',x+1,y,15,16);
      pfill('#0A5010',x,y,3,16);
      pfill('#B8F070',x+13,y,2,16);
    }
  }
}

function drawTile(id,sx,sy,tx,ty){
  const bo=bumpOff(tx,ty);
  const y=sy+bo;
  if(id===T_GROUND)drawGroundTile(sx,sy);
  else if(id===T_BRICK)drawBrick(sx,y);
  else if(id===T_Q)drawQ(sx,y,false);
  else if(id===T_USED)drawQ(sx,y,true);
  else if(id===T_HARD)drawHard(sx,y);
  else if(id>=T_PL&&id<=T_PTR)drawPipeTile(sx,sy,id);
}

function drawMario(x,y){
  const ix=x|0,iy=y|0;
  const red='#E42818',brn='#6C2810',skn='#FCB868',drk='#301008',sh='#481808';
  const jump=mario.jumping||!mario.onGround;
  const f=mario.frame%3;
  if(mario.safe&&((time/2)|0)%2===0)return;
  pfill(red,ix+4,iy+0,8,3);
  pfill(red,ix+3,iy+2,11,2);
  pfill(skn,ix+4,iy+4,9,6);
  pfill(drk,ix+3,iy+4,2,5);
  pfill(drk,ix+5,iy+4,4,2);
  pfill(drk,ix+2,iy+5,2,2);
  pfill('#200000',ix+10,iy+5,2,2);
  pfill('#200000',ix+9,iy+8,5,1);
  pfill('#200000',ix+11,iy+7,3,1);
  pfill(skn,ix+8,iy+7,2,1);
  pfill(red,ix+5,iy+10,7,3);
  pfill(brn,ix+6,iy+10,5,4);
  pfill('#F0C020',ix+7,iy+11,1,1);
  pfill('#F0C020',ix+9,iy+11,1,1);
  if(jump){
    pfill(skn,ix+0,iy+9,3,2);
    pfill(red,ix+1,iy+10,3,2);
    pfill(skn,ix+13,iy+8,3,2);
    pfill(red,ix+12,iy+9,3,2);
    pfill(brn,ix+4,iy+14,4,2);
    pfill(brn,ix+9,iy+14,4,2);
    pfill(sh,ix+4,iy+15,4,1);
    pfill(sh,ix+9,iy+15,4,1);
  }else{
    pfill(skn,f===2?ix+1:ix+12,iy+10,3,2);
    pfill(red,f===2?ix+2:ix+11,iy+11,2,2);
    if(f===0){
      pfill(brn,ix+4,iy+14,4,2);pfill(brn,ix+9,iy+14,4,2);
      pfill(sh,ix+4,iy+15,4,1);pfill(sh,ix+9,iy+15,4,1);
    }else if(f===1){
      pfill(brn,ix+6,iy+14,5,2);pfill(sh,ix+6,iy+15,5,1);
    }else{
      pfill(brn,ix+3,iy+14,4,2);pfill(brn,ix+10,iy+14,4,2);
      pfill(sh,ix+3,iy+15,4,1);pfill(sh,ix+10,iy+15,4,1);
    }
  }
}

function drawGoomba(x,y,e){
  const ix=x|0,iy=y|0;
  if(e.dead&&e.dead<14){
    pfill('#A05018',ix,iy+8,16,6);
    pfill('#F8F0D0',ix+3,iy+9,3,2);
    pfill('#F8F0D0',ix+10,iy+9,3,2);
    pfill('#201000',ix+4,iy+10,2,1);
    pfill('#201000',ix+11,iy+10,2,1);
    return;
  }
  const f=((e.frame/8)|0)%2;
  pfill('#8A3C10',ix+3,iy+2,10,8);
  pfill('#A05018',ix+2,iy+4,12,7);
  pfill('#C07030',ix+4,iy+3,8,3);
  pfill('#F8F0D0',ix+3,iy+5,4,4);
  pfill('#F8F0D0',ix+9,iy+5,4,4);
  pfill('#201000',ix+5,iy+6,2,3);
  pfill('#201000',ix+10,iy+6,2,3);
  pfill('#201000',ix+6,iy+10,4,1);
  pfill('#3A1808',ix+(f?1:2),iy+12,5,3);
  pfill('#3A1808',ix+(f?9:10),iy+12,5,3);
}

function drawKoopa(x,y,e){
  const ix=x|0,iy=y|0;
  const f=((e.frame/8)|0)%2;
  if(e.dead&&e.dead<14){
    pfill('#30A028',ix+1,iy+8,14,7);
    pfill('#E8E060',ix+4,iy+10,8,4);
    return;
  }
  pfill('#30B030',ix+2,iy+4,12,9);
  pfill('#E8E060',ix+4,iy+6,8,6);
  pfill('#208020',ix+3,iy+5,10,1);
  pfill('#F8C070',ix+4,iy+0,7,5);
  pfill('#F8F0D0',ix+8,iy+1,2,2);
  pfill('#201000',ix+9,iy+2,1,1);
  pfill('#C04020',ix+3,iy+0,5,2);
  pfill('#F8C070',ix+(f?1:11),iy+10,3,3);
  pfill('#204090',ix+(f?2:3),iy+13,4,3);
  pfill('#204090',ix+(f?9:10),iy+13,4,3);
}

function drawCoin(x,y,ph){
  const ix=x|0,iy=y|0;
  const fr=((time/6+ph*3)|0)%4;
  const gold='#F8D020',dk='#C07810',hi='#F8F0A0';
  if(fr===0){pfill(gold,ix+2,iy,4,8);pfill(hi,ix+3,iy+1,2,1);pfill(dk,ix+3,iy+3,2,2);}
  else if(fr===1||fr===3){pfill(gold,ix+3,iy,2,8);pfill(hi,ix+3,iy+1,1,1);}
  else {pfill(gold,ix+3,iy+1,2,6);}
}

function drawParticles(){
  for(const p of particles){
    const sx=p.x-cameraX,sy=p.y;
    if(p.kind==='coin')drawCoin(sx,sy,p.ph);
    else if(p.kind==='spark'){
      pfill('#F8F0A0',sx,sy,2,2);
    }else if(p.kind==='brick'){
      pfill('#C84C0C',sx,sy,3,3);
      pfill('#F4A07A',sx,sy,3,1);
    }
  }
}

const hills=[[40,42],[180,50],[320,36],[520,48],[740,40],[960,52],[1180,38],[1400,46],[1620,42],[1840,50],[2060,36],[2280,48],[2500,40],[2720,44],[2940,38]];
const clouds=[[30,28,1],[90,18,1.2],[160,36,0.9],[240,22,1.1],[310,40,1],[400,16,1.3],[480,30,1],[560,20,0.8],[650,34,1.1],[740,18,1],[830,28,1.2],[920,38,0.9],[1010,22,1],[1120,16,1.2],[1240,32,1],[1360,20,0.9],[1480,26,1.1],[1600,18,1],[1720,34,1.2],[1840,22,0.8],[1960,28,1],[2100,16,1.3],[2240,30,1],[2380,20,1.1],[2500,36,0.9],[2640,18,1],[2760,26,1.2],[2880,22,1]];
const bushes=[[48,1],[100,1.1],[210,0.9],[280,1],[360,1.2],[450,0.9],[610,1],[700,1.1],[790,1],[900,0.8],[1020,1],[1140,1.1],[1220,0.9],[1340,1],[1488,1.2],[1590,0.9],[1700,1],[1860,1.1],[1980,1],[2140,0.9],[2300,1],[2460,1.1],[2600,0.9],[2780,1]];

function drawBG(){
  const gdt=ctx.createLinearGradient(0,0,0,VIEW_H);
  gdt.addColorStop(0,SKY2);gdt.addColorStop(0.55,SKY);gdt.addColorStop(1,'#4A88F0');
  ctx.fillStyle=gdt;ctx.fillRect(0,0,VIEW_W,VIEW_H);

  const c1=cameraX*0.22;
  for(const cl of clouds){
    let x=cl[0]-c1;
    x=((x%(WORLD_W*0.7))+WORLD_W*0.7)%(WORLD_W*0.7);
    if(x<VIEW_W+40&&x>-50)drawCloud(x,cl[1],cl[2]);
    if(x-WORLD_W*0.7>-50)drawCloud(x-WORLD_W*0.7,cl[1],cl[2]);
  }
  const c2=cameraX*0.48;
  for(const h of hills){
    let x=h[0]-c2;
    x=((x%WORLD_W)+WORLD_W)%WORLD_W;
    if(x<VIEW_W+80&&x>-80)drawHill(x,13*TILE+2,h[1]);
    if(x-WORLD_W>-80&&x-WORLD_W<VIEW_W+80)drawHill(x-WORLD_W,13*TILE+2,h[1]);
  }
  const c3=cameraX;
  for(const b of bushes){
    let x=b[0]-c3;
    x=((x%WORLD_W)+WORLD_W)%WORLD_W;
    if(x<VIEW_W+50&&x>-50)drawBush(x,13*TILE+1,b[1]);
    if(x-WORLD_W>-50)drawBush(x-WORLD_W,13*TILE+1,b[1]);
  }
}

function drawWorld(){
  const startTx=Math.floor(cameraX/TILE)-1;
  const endTx=startTx+Math.ceil(VIEW_W/TILE)+2;
  for(let ty=0;ty<MAP_H;ty++){
    for(let tx=startTx;tx<=endTx;tx++){
      const id=getT(tx,ty);
      if(!id)continue;
      const sx=tx*TILE-cameraX;
      const sy=ty*TILE;
      drawTile(id,sx,sy,tx,ty);
    }
  }
}

function drawEntities(){
  for(const c of coins){
    if(c.got)continue;
    const wx=worldEntX(c.x);
    const sx=wx-cameraX;
    if(sx>-16&&sx<VIEW_W+16)drawCoin(sx,c.y+Math.sin(time*0.12+c.ph)*2.2,c.ph);
  }
  for(const e of enemies){
    if(e.y>VIEW_H+20)continue;
    const wx=worldEntX(e.x);
    const sx=wx-cameraX;
    if(sx>-20&&sx<VIEW_W+20){
      if(e.type===1)drawKoopa(sx,e.y,e);
      else drawGoomba(sx,e.y+4,e);
    }
  }
  drawParticles();
  const mx=mario.x-cameraX;
  if(mario.pipeState===1){
    ctx.save();
    ctx.beginPath();
    ctx.rect(mx-8,0,32,13*TILE);
    ctx.clip();
    drawMario(mx,mario.y);
    ctx.restore();
  }else if(mario.pipeState===2){
    ctx.save();
    ctx.beginPath();
    ctx.rect(0,0,VIEW_W,mario.y+mario.h);
    ctx.clip();
    drawMario(mx,mario.y);
    ctx.restore();
  }else drawMario(mx,mario.y);
}

function draw(){
  ctx.imageSmoothingEnabled=false;
  drawBG();
  drawWorld();
  drawEntities();

  const sw=window.innerWidth,sh=window.innerHeight;
  if(screen.width!==sw||screen.height!==sh){screen.width=sw;screen.height=sh;}
  sctx.imageSmoothingEnabled=false;
  sctx.fillStyle=SKY;
  sctx.fillRect(0,0,sw,sh);
  const scale=Math.max(sw/VIEW_W,sh/VIEW_H);
  const dw=VIEW_W*scale,dh=VIEW_H*scale;
  const ox=(sw-dw)/2,oy=(sh-dh)/2;
  const jx=shake?((Math.random()-0.5)*shake*scale*0.4):0;
  const jy=shake?((Math.random()-0.5)*shake*scale*0.4):0;
  sctx.drawImage(view,ox+jx,oy+jy,dw,dh);
}

function loop(now){
  let dt=now-last;last=now;
  if(dt>64)dt=64;
  acc+=dt;
  const step=1000/60;
  let n=0;
  while(acc>=step&&n<5){update();acc-=step;n++;}
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
})();
</script>
